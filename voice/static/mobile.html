<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SalesGod</title>
<style>
:root{--bg:#0b0c10;--card:#15171d;--card2:#1c1f27;--line:#262a33;--fg:#eef0f4;--mute:#8b92a0;--acc:#ff6a2b;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--blue:#60a5fa;
--top:env(safe-area-inset-top);--bot:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);outline:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label{display:block;font-size:12px;color:var(--mute);margin:14px 2px 6px;font-weight:500;letter-spacing:.02em}
.app{display:flex;flex-direction:column;height:100dvh}
.top{padding:calc(var(--top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:rgba(11,12,16,.92);backdrop-filter:blur(12px)}
.top h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.02em;flex:1}
.top .ten{width:auto;max-width:46%;padding:7px 30px 7px 12px;font-size:14px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block;flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
.dot.bad{background:var(--bad)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}
.tabs{display:flex;border-top:1px solid var(--line);background:#0e1015;padding-bottom:var(--bot)}
.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);font-weight:500}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.list{display:flex;flex-direction:column;gap:10px}
.call{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:600;color:var(--mute);flex:none;font-size:15px}
.av.live{background:rgba(52,211,153,.15);color:var(--ok)}
.call .b{flex:1;min-width:0}
.call .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--mute);white-space:nowrap}
.pill.live{background:rgba(52,211,153,.15);color:var(--ok)}.pill.failed{background:rgba(248,113,113,.14);color:var(--bad)}
.pill.ringing,.pill.dialing{background:rgba(251,191,36,.14);color:var(--warn)}.pill.sold{background:rgba(255,106,43,.16);color:var(--acc)}
.sec{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.07em;margin:18px 4px 8px}
.sec:first-child{margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font-weight:650;font-size:16px;background:var(--acc);color:#fff}
.btn:active{transform:scale(.98);opacity:.9}
.btn.sec2{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.btn.red{background:var(--bad)}
.btn[disabled]{opacity:.5}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:10px 0;border-radius:9px;font-size:14px;font-weight:550;color:var(--mute)}
.seg button.on{background:var(--fg);color:var(--bg)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.bub{max-width:84%;padding:10px 13px;border-radius:18px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.bub.a{background:var(--card2);border-bottom-left-radius:6px;align-self:flex-start}
.bub.c{background:var(--acc);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:4px}
.thread{display:flex;flex-direction:column;gap:8px}
.ev{align-self:center;font-size:12px;color:var(--mute);background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .hd{padding:calc(var(--top) + 8px) 8px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.back{border:0;background:none;padding:8px;display:flex;color:var(--acc)}
.sheet .hd .t{flex:1;min-width:0}.sheet .hd b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sheet .hd small{color:var(--mute);font-size:12.5px}
.sheet .ft{padding:10px 14px calc(var(--bot) + 10px);border-top:1px solid var(--line);background:#0e1015}
.compose{display:flex;gap:8px;padding:8px 10px calc(var(--bot) + 8px);border-top:1px solid var(--line);background:#0e1015}
.compose input{border-radius:999px;padding:11px 16px}
.send{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:650;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--mute)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.empty{text-align:center;color:var(--mute);padding:50px 20px}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(var(--bot) + 80px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:550;z-index:50;max-width:90%}
.typing{align-self:flex-start;color:var(--mute);font-size:13px;padding:4px 8px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mute);margin-top:14px}.chk input{width:20px;height:20px;padding:0;appearance:auto;flex:none}
audio{width:100%;margin-top:8px}
.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--acc),#ff3d6e);margin-bottom:18px}
</style></head>
<body><div id="root"></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={calls:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
dial:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
back:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
send:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>'};
const S={tab:localStorage.sgm_tab||'calls',tenant:localStorage.sgm_tenant||'',tenants:[],products:[],calls:[],conn:'',open:null,sim:{sid:null,turns:[],busy:false,pid:'',lang:'hinglish'},nc:{lang:'hi'},stats:null};
async function api(p,o={}){const r=await fetch(p,{credentials:'same-origin',headers:{'content-type':'application/json'},...o});if(r.status===401){S.authed=false;render();throw new Error('Sign in')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||('Error '+r.status));return j}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
const ago=t=>{if(!t)return'';const s=Date.now()/1000-t;return s<60?'now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const dur=c=>{if(!c.answered_at)return'';const e=c.ended_at||Date.now()/1000;const s=Math.round(e-c.answered_at);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const myProducts=()=>S.products.filter(p=>!S.tenant||p.tenant===S.tenant);
const pnm=p=>p.product_name||p.name||p.id;const pname=id=>{const p=S.products.find(p=>p.id===id);return p?pnm(p):(id||'')};
const sold=c=>(c.turns||[]).some(t=>t.intent==='link_sent');
const isLive=c=>['live','ringing','dialing'].includes(c.status);
function statusPill(c){if(sold(c))return'<span class="pill sold">Sold</span>';const m={live:'Live',ringing:'Ringing',dialing:'Dialing',ended:'Ended',failed:'Failed'};return`<span class="pill ${c.status}">${m[c.status]||c.status}</span>`}

async function boot(){try{const me=await api('/api/me');S.authed=me.authed}catch(e){S.authed=false}
 if(!S.authed)return render();
 const[t,p]=await Promise.all([api('/api/tenants'),api('/api/products')]);S.tenants=t.tenants||[];S.products=p.products||[];
 if(!S.tenants.find(x=>x.id===S.tenant))S.tenant=(S.tenants[0]||{}).id||'';
 await loadCalls();render();sse();}
async function loadCalls(){try{S.calls=(await api('/api/calls')).calls||[]}catch(e){}}
let es;function sse(){if(es)es.close();es=new EventSource('/api/events');es.onopen=()=>{S.conn='ok';$('#cdot')&&($('#cdot').className='dot ok')};es.onerror=()=>{S.conn='bad';$('#cdot')&&($('#cdot').className='dot bad')};
 es.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}
  if(d.type==='status'){const i=S.calls.findIndex(c=>c.call_id===d.call.call_id);if(i>=0)S.calls[i]=d.call;else S.calls.unshift(d.call)}
  else if(d.call_id){const c=S.calls.find(c=>c.call_id===d.call_id);if(!c)return;if(d.type==='turn'){c.turns=c.turns||[];const{type,call_id,...t}=d;c.turns.push(t)}else if(d.type!=='map'){c.events=c.events||[];const{call_id,...ev}=d;c.events.push(ev)}else return}
  else return;
  const cid=d.call_id||(d.call&&d.call.call_id);if(S.open&&cid===S.open)drawCall();if(S.tab==='calls'&&!S.open)drawView();}}

function render(){const r=$('#root');
 if(S.authed===false){r.innerHTML=`<div class="login"><div class="logo"></div><h1 style="margin:0 0 6px;font-size:28px;letter-spacing:-.03em">SalesGod</h1><p style="color:var(--mute);margin:0 0 26px">Your AI voice sales agent.</p>
 <label>Password</label><input id="pw" type="password" autocomplete="current-password"><div style="height:16px"></div><button class="btn" id="go">Sign in</button><div class="err" id="lerr"></div></div>`;
 const go=async()=>{try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});boot()}catch(e){$('#lerr').textContent=e.message}};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};return}
 if(!S.authed){r.innerHTML='';return}
 const T={calls:'Calls',dial:'New call',chat:'Test chat',stats:'Stats'};
 r.innerHTML=`<div class="app"><div class="top"><span id="cdot" class="dot ${S.conn}"></span><h1>${T[S.tab]}</h1>
 <select class="ten" id="ten">${S.tenants.map(t=>`<option value="${esc(t.id)}" ${t.id===S.tenant?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
 <div class="view" id="view"></div>
 <nav class="tabs">${Object.entries(T).map(([k,v])=>`<button data-t="${k}" class="${S.tab===k?'on':''}">${I[k]}<span>${v}</span></button>`).join('')}</nav></div>`;
 $('#ten').onchange=e=>{S.tenant=localStorage.sgm_tenant=e.target.value;S.sim={...S.sim,sid:null,turns:[],pid:''};render()};
 r.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=localStorage.sgm_tab=b.dataset.t;render()});
 drawView();}
function drawView(){const v=$('#view');if(!v)return;({calls:vCalls,dial:vDial,chat:vChat,stats:vStats})[S.tab](v)}

function vCalls(v){const pids=new Set(myProducts().map(p=>p.id));const cs=S.calls.filter(c=>c.to!=='sim'&&(!S.tenant||pids.has(c.campaign)));
 const live=cs.filter(isLive),past=cs.filter(c=>!isLive(c)).slice(0,60);
 const item=c=>{const nm=c.customer_name||c.to||'Unknown';const ct=(c.turns||[]).filter(t=>t.role==='customer').length;
  return`<div class="card call" data-id="${c.call_id}"><div class="av ${isLive(c)?'live':''}">${/^[+\d]/.test(nm)?'#':esc(nm.slice(0,1).toUpperCase())}</div><div class="b"><div class="n">${esc(nm)}</div><div class="s">${esc(pname(c.campaign))} · ${ct} replies${dur(c)?' · '+dur(c):''} · ${ago(c.created_at)}</div></div>${statusPill(c)}</div>`};
 v.innerHTML=(live.length?`<div class="sec">Live now</div><div class="list">${live.map(item).join('')}</div>`:'')+
  `<div class="sec">Recent</div>`+(past.length?`<div class="list">${past.map(item).join('')}</div>`:`<div class="empty">No calls yet.<br><br><button class="btn" style="width:auto;padding:12px 22px;margin:auto" onclick="S.tab='dial';render()">Make a call</button></div>`);
 v.querySelectorAll('.call').forEach(e=>e.onclick=()=>openCall(e.dataset.id));}

function openCall(id){S.open=id;const s=document.createElement('div');s.className='sheet';s.id='sheet';document.body.append(s);history.pushState({s:1},'');drawCall()}
function closeCall(){S.open=null;$('#sheet')?.remove();drawView()}
window.onpopstate=()=>{if(S.open)closeCall()};
function drawCall(){const s=$('#sheet');const c=S.calls.find(x=>x.call_id===S.open);if(!s||!c)return;
 const nearBottom=!$('#thr')||($('#thr').scrollHeight-$('#thr').scrollTop-$('#thr').clientHeight<80);
 const items=[];(c.turns||[]).forEach((t,i)=>items.push({k:'t',t,i}));
 (c.events||[]).filter(e=>['barge_in','sms','error','link_sent'].includes(e.type)).forEach(e=>items.push({k:'e',e,i:(e.after_turn??999)-.5}));
 items.sort((a,b)=>a.i-b.i);
 const body=items.map(x=>x.k==='t'?`<div class="bub ${x.t.role==='customer'?'c':'a'}">${esc(x.t.text)}${x.t.role==='agent'&&x.t.intent?`<small>${esc(String(x.t.intent).replace(/_/g,' '))}</small>`:x.t.emotion?`<small>${esc(x.t.emotion)}</small>`:''}</div>`
  :`<div class="ev">${esc(x.e.type==='barge_in'?'Customer interrupted':x.e.type==='error'?'⚠ '+(x.e.message||'error'):x.e.type.replace(/_/g,' '))}</div>`).join('');
 const nm=c.customer_name||c.to;
 s.innerHTML=`<div class="hd"><button class="back" id="bk">${I.back}</button><div class="t"><b>${esc(nm)}</b><small>${esc(pname(c.campaign))} · ${esc(c.language)}${dur(c)?' · '+dur(c):''}</small></div>${statusPill(c)}<span style="width:8px"></span></div>
 <div class="view" id="thr"><div class="thread">${body||'<div class="empty">Waiting for the call to connect…</div>'}${c.end_reason&&!isLive(c)?`<div class="ev">Ended · ${esc(String(c.end_reason).replace(/_/g,' '))}</div>`:''}</div>
 ${c.status==='ended'&&c.answered_at?`<audio controls preload="none" src="/api/calls/${c.call_id}/recording"></audio>`:''}</div>
 ${c.status==='live'||c.status==='ringing'?`<div class="ft"><button class="btn red" id="hang">End call</button></div>`:''}`;
 $('#bk').onclick=()=>history.back();
 const h=$('#hang');if(h)h.onclick=async()=>{h.disabled=true;try{await api(`/api/calls/${c.call_id}/hangup`,{method:'POST'});toast('Hanging up…')}catch(e){toast(e.message);h.disabled=false}};
 const th=$('#thr');if(nearBottom)th.scrollTop=th.scrollHeight;}

function langSeg(cur,id){return`<div class="seg" id="${id}">${[['hi','Hindi'],['hinglish','Hinglish'],['en','English']].map(([k,v])=>`<button data-l="${k}" class="${cur===k?'on':''}">${v}</button>`).join('')}</div>`}
function vDial(v){const ps=myProducts();
 v.innerHTML=`<div class="card"><label style="margin-top:0">Product</label><select id="dp">${ps.map(p=>`<option value="${esc(p.id)}">${esc(pnm(p))}</option>`).join('')}</select>
 <label>Phone number</label><input id="dn" type="tel" inputmode="tel" placeholder="+91 98765 43210" autocomplete="tel">
 <div class="row"><div><label>Name (optional)</label><input id="dname" placeholder="Rahul"></div><div style="flex:.55"><label>Age</label><input id="dage" type="number" inputmode="numeric" placeholder="—"></div></div>
 <label>Language</label>${langSeg(S.nc.lang,'dl')}
 <label class="chk"><input type="checkbox" id="dflag"> Call even if safety-flagged before</label></div>
 <div style="height:14px"></div><button class="btn" id="dgo">${I.calls.replace('<svg','<svg width="20" height="20"')} Call now</button><div class="err" id="derr"></div>
 <p style="color:var(--mute);font-size:13px;text-align:center;margin-top:14px">Several numbers? Separate them with commas.</p>`;
 v.querySelectorAll('#dl button').forEach(b=>b.onclick=()=>{S.nc.lang=b.dataset.l;v.querySelectorAll('#dl button').forEach(x=>x.classList.toggle('on',x===b))});
 $('#dgo').onclick=async()=>{const b=$('#dgo');$('#derr').textContent='';if(!$('#dn').value.trim()){$('#derr').textContent='Enter a phone number';return}b.disabled=true;
  try{const r=await api('/api/calls',{method:'POST',body:JSON.stringify({numbers:$('#dn').value,campaign:$('#dp').value,language:S.nc.lang,backend:'llm',customer_name:$('#dname').value,customer_age:$('#dage').value||null,allow_flagged:$('#dflag').checked})});
   const ok=(r.calls||[]).filter(c=>c.call_id&&!c.error),bad=(r.calls||[]).filter(c=>c.error&&!c.call_id);
   if(bad.length)$('#derr').textContent=bad.map(c=>c.number+': '+c.error).join('\n');
   if(ok.length){toast('Calling…');await loadCalls();S.tab='calls';localStorage.sgm_tab='calls';render();if(ok.length===1)openCall(ok[0].call_id)}}
  catch(e){$('#derr').textContent=e.message}b.disabled=false}}

function vChat(v){const ps=myProducts();const sm=S.sim;if(!ps.find(p=>p.id===sm.pid))sm.pid=(ps[0]||{}).id||'';
 if(!sm.sid){v.innerHTML=`<div class="card"><p style="margin:0 0 4px;color:var(--mute);font-size:14px">Play the customer by text. The agent replies just like on a phone call.</p>
  <label>Product</label><select id="sp">${ps.map(p=>`<option value="${esc(p.id)}" ${p.id===sm.pid?'selected':''}>${esc(pnm(p))}</option>`).join('')}</select>
  <label>Language</label>${langSeg(sm.lang,'sl')}
  <div class="row"><div><label>Your name</label><input id="sn" placeholder="Optional"></div><div style="flex:.55"><label>Age</label><input id="sa" type="number" inputmode="numeric" placeholder="—"></div></div></div>
  <div style="height:14px"></div><button class="btn" id="sgo">Start chat</button><div class="err" id="serr"></div>`;
  $('#sp').onchange=e=>sm.pid=e.target.value;
  v.querySelectorAll('#sl button').forEach(b=>b.onclick=()=>{sm.lang=b.dataset.l;v.querySelectorAll('#sl button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#sgo').onclick=async()=>{const b=$('#sgo');b.disabled=true;b.textContent='Starting…';
   try{const r=await api('/api/sim/start',{method:'POST',body:JSON.stringify({campaign:sm.pid,language:sm.lang,backend:'llm',customer_name:$('#sn').value,customer_age:$('#sa').value||null})});sm.sid=r.sim_id;sm.turns=[{role:'agent',text:r.agent}];drawView()}
   catch(e){$('#serr').textContent=e.message;b.disabled=false;b.textContent='Start chat'}};return}
 v.style.padding='0';v.style.display='flex';v.style.flexDirection='column';
 v.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)"><span>${esc(pname(sm.pid))} · ${esc(sm.lang)}</span><button class="pill" id="snew" style="border:0">New chat</button></div>
 <div id="sthr" style="flex:1;overflow-y:auto;padding:14px"><div class="thread">${sm.turns.map(t=>`<div class="bub ${t.role==='customer'?'c':'a'}">${esc(t.text)}${t.meta?`<small>${esc(t.meta)}</small>`:''}</div>`).join('')}${sm.busy?'<div class="typing">Agent is typing…</div>':''}${sm.ended?'<div class="ev">Call ended</div>':''}</div></div>
 <div class="compose"><input id="smsg" placeholder="${sm.ended?'Chat ended':'Say something…'}" ${sm.ended?'disabled':''} enterkeyhint="send" autocomplete="off"><button class="send" id="ssend" ${sm.ended?'disabled':''}>${I.send}</button></div>`;
 const th=$('#sthr');th.scrollTop=th.scrollHeight;
 $('#snew').onclick=()=>{S.sim={...sm,sid:null,turns:[],ended:false,busy:false};resetView();drawView()};
 const send=async()=>{const m=$('#smsg').value.trim();if(!m||sm.busy)return;sm.turns.push({role:'customer',text:m});sm.busy=true;drawView();
  try{const r=await api('/api/sim/'+sm.sid,{method:'POST',body:JSON.stringify({text:m})});
   (r.interim||[]).forEach(x=>sm.turns.push({role:'agent',text:x}));sm.turns.push({role:'agent',text:r.agent,meta:`${String(r.intent||'').replace(/_/g,' ')} · ${(r.latency_ms/1000).toFixed(1)}s`});if(r.end_call)sm.ended=true}
  catch(e){sm.turns.push({role:'agent',text:'⚠ '+e.message})}sm.busy=false;if(S.tab==='chat'){drawView();$('#smsg')?.focus()}};
 $('#ssend').onclick=send;$('#smsg').onkeydown=e=>{if(e.key==='Enter')send()};}
function resetView(){const v=$('#view');if(v){v.style.padding='';v.style.display='';v.style.flexDirection=''}}

async function vStats(v){resetView();v.innerHTML='<div class="empty">Loading…</div>';let d;try{d=await api('/api/progress')}catch(e){v.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
 if(S.tab!=='stats')return;const s=d.stats||{},r=d.roadmap||{};
 const st=(n,l)=>`<div class="stat"><b>${n??'—'}</b><span>${l}</span></div>`;
 const conv=s.calls?Math.round(100*(s.connected||0)/s.calls):0;
 v.innerHTML=`<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--mute);font-size:13px">Answer rate</span><b style="font-size:22px">${conv}%</b></div><div class="bar"><i style="width:${conv}%"></i></div></div>
 <div class="stats">${st(s.calls,'Calls placed')}${st(s.connected,'Answered')}${st(s.sold,'Payment links sent')}${st(s.opt_outs,'Opted out')}${st(s.avg_first_audio_ms?(s.avg_first_audio_ms/1000).toFixed(2)+'s':null,'Avg reply time')}${st(s.sim_conversations,'Test chats')}</div>
 <div class="sec">Calls by product</div><div class="card">${Object.entries(s.by_campaign||{}).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(pname(k))}</span><b>${n}</b></div>`).join('')||'<span style="color:var(--mute)">None yet</span>'}</div>
 <div class="sec">Build progress · ${r.overall_pct??0}%</div><div class="card">${(r.areas||[]).map(a=>{const its=a.items||[];const p=its.length?Math.round(its.reduce((x,i)=>x+i.pct,0)/its.length):0;return`<div style="padding:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(a.name||a.title||'')}</span><span style="color:var(--mute)">${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}</div>
 <p style="text-align:center;margin-top:20px"><a href="/?desktop=1" style="color:var(--mute);font-size:13px">Open full desktop console</a></p>`}

setInterval(()=>{if(S.open){const c=S.calls.find(x=>x.call_id===S.open);if(c&&c.status==='live')drawCall()}else if(S.tab==='calls'&&S.calls.some(c=>c.status==='live'))drawView()},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.authed){loadCalls().then(()=>{S.open?drawCall():drawView()});if(S.conn!=='ok')sse()}});
boot();
</script></body></html>
