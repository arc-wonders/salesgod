<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalesGod - Add a product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same tokens and components as console.html */
:root{
  --bg:220 10% 5.7%;--fg:60 8% 92%;--muted:216 5% 65%;--tertiary:217 5% 50%;--body:216 6% 72%;
  --rule:210 9% 13.5%;--rule-strong:214 8% 18%;--rule-heavy:216 8% 25%;
  --panel:214 12% 8%;--elevated:216 10% 10.5%;--sidebar:220 10% 5.7%;--hover:210 9% 12.5%;--field:216 11% 7.5%;
  --signal:16 100% 56%;--on-signal:220 10% 6%;--green:153 44% 49%;--amber:38 85% 55%;--red:358 70% 62%;--blue:216 70% 66%;--slate:217 12% 60%;--violet:262 60% 70%;
  --font:'Geist',ui-sans-serif,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;--r:8px;--r-lg:12px;color-scheme:dark;
}
.light{
  --bg:45 14% 96%;--fg:220 10% 9%;--muted:220 5% 36%;--tertiary:220 4% 46%;--body:220 6% 24%;
  --rule:40 8% 86%;--rule-strong:40 6% 78%;--rule-heavy:40 6% 68%;
  --panel:45 18% 99%;--elevated:45 12% 94%;--sidebar:45 12% 93%;--hover:40 10% 89%;--field:0 0% 100%;
  --signal:16 100% 50%;--on-signal:0 0% 100%;--green:153 45% 32%;--amber:38 80% 36%;--red:358 65% 46%;--blue:216 55% 45%;--slate:217 12% 42%;--violet:262 45% 50%;color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:hsl(var(--bg));color:hsl(var(--fg));font-family:var(--font);font-size:13.5px;line-height:1.5;font-feature-settings:'ss01','tnum';-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid hsl(var(--signal)/.8);outline-offset:2px}
.mono{font-family:var(--mono)}
a{color:hsl(var(--blue))}
.topbar{display:flex;min-height:56px;align-items:center;gap:10px;padding:8px 24px;border-bottom:1px solid hsl(var(--rule));position:sticky;top:0;z-index:5;background:hsl(var(--bg)/.94);backdrop-filter:blur(12px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:20px;height:20px;border-radius:5px;background:hsl(var(--signal));display:grid;place-items:center;flex:none}
.brand .mk i{width:8px;height:8px;border-radius:50%;background:hsl(var(--bg))}
.brand b{font-weight:600;font-size:14px;letter-spacing:-.02em}
.brand .crumb{color:hsl(var(--tertiary));font-size:13px;white-space:nowrap}
.sp{flex:1}
#prodsel{width:280px;max-width:100%}
.icon-btn{display:grid;flex:0 0 34px;width:34px;height:34px;place-items:center;border:1px solid hsl(var(--rule-strong));border-radius:999px;background:transparent;color:hsl(var(--muted));cursor:pointer}
.icon-btn:hover{border-color:hsl(var(--rule-heavy));color:hsl(var(--fg))}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid hsl(var(--rule));overflow-x:auto}
.tab{height:42px;padding:0 14px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:hsl(var(--muted));cursor:pointer;font-weight:500;white-space:nowrap}
.tab:hover{color:hsl(var(--fg))}
.tab.on{color:hsl(var(--fg));border-bottom-color:hsl(var(--signal))}
.wrap{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:0;min-height:calc(100vh - 100px)}
.col{padding:24px 28px 64px;min-width:0}
.col.left{border-right:1px solid hsl(var(--rule))}
h1{margin:0 0 6px;font-size:21px;font-weight:550;letter-spacing:-.02em}
h2{margin:0;font-size:14px;font-weight:550}
p.sub{margin:0 0 16px;color:hsl(var(--muted));font-size:13.5px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border:1px solid hsl(var(--rule-strong));border-radius:999px;background:hsl(var(--panel));font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;color:hsl(var(--fg))}
.btn:hover{border-color:hsl(var(--rule-heavy));background:hsl(var(--elevated))}
.btn.pri{background:hsl(var(--signal));border-color:hsl(var(--signal));color:hsl(var(--on-signal))}
.btn.pri:hover{filter:brightness(1.07)}
.btn.lg{height:40px;padding:0 20px;font-size:14px}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:hsl(var(--muted))}
.btn.ghost:hover{color:hsl(var(--fg));background:hsl(var(--hover))}
.btn.danger{color:hsl(var(--red))}
.btn:disabled{opacity:.45;cursor:default;filter:none}
input,select,textarea{width:100%;height:36px;padding:0 11px;border:1px solid hsl(var(--rule-strong));border-radius:var(--r);background:hsl(var(--field));font-size:13.5px}
select{padding-right:30px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,hsl(var(--tertiary)) 50%),linear-gradient(135deg,hsl(var(--tertiary)) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10.5px) 52%;background-size:4.5px 4.5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{outline:0;border-color:hsl(var(--signal)/.8);box-shadow:0 0 0 3px hsl(var(--signal)/.15)}
input.big{height:44px;font-size:15px;padding:0 14px}
input.invalid{border-color:hsl(var(--red));box-shadow:0 0 0 3px hsl(var(--red)/.12)}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:hsl(var(--signal));flex:none}
input::placeholder,textarea::placeholder{color:hsl(var(--tertiary))}
textarea{height:auto;padding:9px 11px;resize:vertical;line-height:1.55}
.lbl{display:block;margin:16px 0 6px;color:hsl(var(--body));font-size:12.5px;font-weight:500}
.sec-lbl.lbl,.sec-lbl{display:block;margin:24px 0 2px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--tertiary))}
.hint{color:hsl(var(--tertiary));font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:9px;align-items:flex-start;margin:12px 0;font-size:13px;color:hsl(var(--body));cursor:pointer}
.chk input{margin-top:1px}
details.adv{margin-top:16px;border:1px solid hsl(var(--rule));border-radius:var(--r-lg);background:hsl(var(--panel))}
details.adv>summary{cursor:pointer;padding:12px 16px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:'';width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.adv[open]>summary::before{transform:rotate(45deg)}
details.adv>summary .hint{font-weight:400;margin-left:auto}
details.adv .in{padding:0 16px 16px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px solid hsl(var(--rule-strong));border-radius:999px;font-size:11.5px;color:hsl(var(--muted));white-space:nowrap;background:hsl(var(--panel))}
.tag.green{color:hsl(var(--green));border-color:hsl(var(--green)/.35);background:hsl(var(--green)/.08)}
.tag.red{color:hsl(var(--red));border-color:hsl(var(--red)/.35);background:hsl(var(--red)/.08)}
.tag.amber{color:hsl(var(--amber));border-color:hsl(var(--amber)/.35);background:hsl(var(--amber)/.08)}
.tag.blue{color:hsl(var(--blue));border-color:hsl(var(--blue)/.35);background:hsl(var(--blue)/.08)}
.tag.sig{color:hsl(var(--signal));border-color:hsl(var(--signal)/.35);background:hsl(var(--signal)/.08)}
.card{border:1px solid hsl(var(--rule));border-radius:var(--r-lg);background:hsl(var(--panel));margin:14px 0;overflow:hidden}
.card>.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid hsl(var(--rule))}
.card>.bd{padding:10px 16px}
.err{color:hsl(var(--red));font-size:13px;margin-top:10px;white-space:pre-wrap}
.err:empty{display:none}
.err:not(:empty){padding:9px 12px;border:1px solid hsl(var(--red)/.35);border-radius:var(--r);background:hsl(var(--red)/.07)}
.okmsg{margin-top:10px;padding:9px 12px;border:1px solid hsl(var(--green)/.35);border-radius:var(--r);background:hsl(var(--green)/.07);color:hsl(var(--green));font-size:13px}
.okmsg:empty{display:none}
.ok{color:hsl(var(--green))}
.brandnote{margin-top:10px;padding:10px 12px;border-radius:var(--r);font-size:12.5px;line-height:1.55}
.brandnote.real{border:1px solid hsl(var(--amber)/.35);background:hsl(var(--amber)/.07);color:hsl(var(--amber))}
.brandnote.own{color:hsl(var(--tertiary));padding:2px 0}
.stage{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid hsl(var(--rule))}
.stage:last-child{border-bottom:0}
.stage b{font-weight:500}
.stage .dot{width:8px;height:8px;border-radius:50%;background:hsl(var(--tertiary));flex:none;position:relative;top:0}
.stage.running .dot{background:hsl(var(--amber));animation:pl 1.4s infinite}
.stage.done .dot{background:hsl(var(--green))}.stage.failed .dot,.stage.cancelled .dot{background:hsl(var(--red))}.stage.skipped .dot{background:hsl(var(--slate))}
@keyframes pl{0%{box-shadow:0 0 0 0 hsl(var(--amber)/.55)}100%{box-shadow:0 0 0 7px hsl(var(--amber)/0)}}
.chk-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid hsl(var(--rule));align-items:baseline;flex-wrap:wrap}
.chk-row:last-child{border-bottom:0}
.chk-row .m{flex:none;width:44px;font-family:var(--mono);font-size:11px}
.tree details{margin-left:14px;border-left:1px solid hsl(var(--rule));padding-left:12px}
.tree>details{margin-left:0;border-left:0;padding-left:0}
.tree summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;list-style:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:'\25B8';color:hsl(var(--tertiary));font-size:10px;width:10px}
.tree details[open]>summary::before{content:'\25BE'}
.qa{margin:6px 0 10px 4px;padding:10px 12px;border:1px solid hsl(var(--rule));border-radius:var(--r);background:hsl(var(--bg))}
.qa .q{font-weight:500}
.qa .a{color:hsl(var(--body));margin-top:4px}
.qa .a b{font-family:var(--mono);font-size:10.5px;color:hsl(var(--tertiary));margin-right:6px;font-weight:400}
.vrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid hsl(var(--rule));cursor:pointer;border-radius:var(--r)}
.vrow:hover{background:hsl(var(--panel))}
.vrow.on{background:hsl(var(--elevated))}
.empty{padding:48px 20px;text-align:center;color:hsl(var(--tertiary));line-height:1.6}
.empty b{display:block;color:hsl(var(--fg));font-weight:500;font-size:14.5px;margin-bottom:4px}
.pill-tabs{display:flex;gap:2px;flex-wrap:wrap;margin:14px 0;padding:2px;border:1px solid hsl(var(--rule-strong));border-radius:999px;background:hsl(var(--field));width:max-content;max-width:100%}
.pill{height:28px;padding:0 12px;border:0;border-radius:999px;background:none;cursor:pointer;font-size:12.5px;font-weight:500;color:hsl(var(--muted))}
.pill.on{background:hsl(var(--elevated));color:hsl(var(--fg));box-shadow:inset 0 0 0 1px hsl(var(--rule-heavy))}
.diff-list{font-family:var(--mono);font-size:11.5px;color:hsl(var(--body));word-break:break-all}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.col.left{border-right:0;border-bottom:1px solid hsl(var(--rule))}}
@media (max-width:640px){.topbar{padding:8px 14px}.brand .crumb{display:none}#prodsel{order:5;width:100%;flex:1 1 100%}.tabs{padding:0 10px}.col{padding:18px 16px 48px}.grid2{grid-template-columns:1fr}input,select,textarea{font-size:16px}.pill-tabs{width:auto;border-radius:14px}}
</style>
</head>
<body>
<div class="topbar">
  <a class="btn ghost" id="backlink" href="/" aria-label="Back to the console">&larr; Console</a>
  <div class="brand"><span class="mk"><i></i></span><b>SalesGod</b><span class="crumb" id="crumb">/ Add a product</span></div>
  <div class="sp"></div>
  <select id="prodsel" aria-label="Generated products"></select>
  <button class="icon-btn" id="theme" aria-label="Toggle theme" title="Toggle theme"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button>
</div>
<div class="tabs" role="tablist">
  <button class="tab on" data-tab="gen" role="tab">Generate</button>
  <button class="tab" data-tab="ver" role="tab">Versions</button>
  <button class="tab" data-tab="gaps" role="tab">Gaps from calls</button>
</div>
<div id="app"></div>

<script>
'use strict';
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
if (store.get('sg_theme', 'dark') === 'light') document.documentElement.classList.add('light');
document.getElementById('theme').onclick = () => { const l = document.documentElement.classList.toggle('light'); store.set('sg_theme', l ? 'light' : 'dark'); };

const S = { tab: 'gen', defaults: null, product: null, versions: [], published: null, vnum: null, v: null, vtab: 'info', job: null, jobTimer: null, diff: null, gaps: null, err: '', brand: null };
const $ = (sel, el = document) => el.querySelector(sel);

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
async function api(path, opts) {
  const r = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts });
  if (r.status === 401) { S.err = 'Sign in on the console first (/), then reload this page.'; throw new Error('401'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(errText(j.detail ?? j.error ?? j.message) || (r.status === 500 ? 'The server had a problem (500). Try again in a moment.' : 'Error ' + r.status));
  return j;
}
/* API error -> readable text (FastAPI validation lists, objects, strings); never raw JSON */
function errText(x) {
  if (x == null) return '';
  if (typeof x === 'string') return x;
  if (Array.isArray(x)) return x.map(errText).filter(Boolean).join('\n');
  if (typeof x === 'object') {
    if (x.msg) { const loc = (x.loc || []).filter((k) => k !== 'body' && k !== 'query').join(' > '); return (loc ? loc.replaceAll('_', ' ') + ': ' : '') + x.msg; }
    return errText(x.message || x.error || x.detail) || Object.entries(x).map(([k, v]) => k.replaceAll('_', ' ') + ': ' + errText(v)).join('\n');
  }
  return String(x);
}
const post = (p, b) => api(p, { method: 'POST', body: JSON.stringify(b) });
const pq = () => `product_id=${encodeURIComponent(S.product.product_id)}&tenant=${encodeURIComponent(S.product.tenant)}`;
const badge = (t, c) => h('span', { class: 'tag ' + (c || '') }, t);
const provBadge = (p) => badge(p, p === 'public' ? 'blue' : p === 'operator' ? 'green' : 'amber');

/* ---------------------------------------------------------------- form */
const F = { name: '', authorised: false };
const field = (label, id, opts = {}) => h('div', {}, h('label', { class: 'lbl', for: id }, label),
  opts.area ? h('textarea', { id, rows: opts.rows || 3, placeholder: opts.ph || '' }, '') : h('input', { id, type: opts.type || 'text', placeholder: opts.ph || '', step: 'any', min: opts.min }));
const val = (id) => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
const num = (id) => { const v = val(id); return v === '' ? null : Number(v); };

function critField(label, key, d) {
  return h('div', {}, h('label', { class: 'lbl', for: 'c_' + key }, label), h('input', { id: 'c_' + key, type: 'number', value: d[key], min: 0 }));
}
function collectSpec() {
  const d = S.defaults.criteria;
  const crit = {};
  for (const k of Object.keys(d)) {
    const e = document.getElementById('c_' + k);
    if (!e) continue;
    crit[k] = e.type === 'checkbox' ? e.checked : Number(e.value);
  }
  const price = { list_price: num('f_list'), offer_price: num('f_offer'), unit: val('f_unit'), validity: val('f_validity') };
  const eco = { floor: num('f_floor'), cost: num('f_cost'), min_margin_pct: num('f_margin'), perks: val('f_perks').split('\n').map((s) => s.trim()).filter(Boolean) };
  const langs = ['en', 'hi', 'hinglish'].filter((l) => document.getElementById('l_' + l).checked);
  const spec = {
    name: val('f_name'), category: val('f_cat'), seller: val('f_seller'), website: val('f_web'), notes: val('f_notes'), city: val('f_city') || 'India',
    languages: langs, price: Object.fromEntries(Object.entries(price).filter(([, v]) => v !== null && v !== '')),
    economics: Object.fromEntries(Object.entries(eco).filter(([, v]) => v !== null && !(Array.isArray(v) && !v.length))),
    tone: val('f_tone'), audience: val('f_aud'), compliance_notes: val('f_comp'), banned_phrases: val('f_ban').split('\n').map((s) => s.trim()).filter(Boolean),
    authorised: document.getElementById('f_auth').checked, tenant: val('f_tenant') || 'default', criteria: crit,
  };
  if (val('f_pid')) spec.product_id = val('f_pid');
  return spec;
}
let brandTimer;
function brandCheck() {
  clearTimeout(brandTimer);
  brandTimer = setTimeout(async () => {
    const name = val('f_name');
    const box = document.getElementById('brandbox');
    if (!box) return;
    if (name.length < 2) { box.replaceChildren(); return; }
    try {
      const b = await post('/api/productgen/brand-check', { name, seller: val('f_seller'), authorised: document.getElementById('f_auth').checked });
      box.replaceChildren(b.real_brand
        ? h('div', { class: 'brandnote real' }, `"${b.brand_match || name}" looks like a real company's product. Public-knowledge facts only, provenance "public", every claim marked for review. Tick the box above only if you own or are authorised to sell it.`)
        : h('div', { class: 'brandnote own' }, 'Demo or own product: full detail will be generated and labelled "synthetic".'));
    } catch (e) { box.replaceChildren(); }
  }, 350);
}
function genForm() {
  const d = S.defaults.criteria;
  const root = h('div', {},
    h('h1', {}, 'Add a product'), h('p', { class: 'sub' }, 'Type the name. Everything else is optional; the generator fills the information tree and the decision tree offline and saves a new version you can review before Publish.'),
    h('label', { class: 'lbl', for: 'f_name' }, 'Product name'),
    h('input', { id: 'f_name', class: 'big', placeholder: 'e.g. ZenBrew Coffee Subscription', oninput: (e) => { e.target.classList.remove('invalid'); brandCheck(); }, value: F.name, autocomplete: 'off' }),
    h('label', { class: 'chk' }, h('input', { type: 'checkbox', id: 'f_auth', onchange: brandCheck }), h('span', {}, 'I own / am authorised to sell this product')),
    h('div', { id: 'brandbox' }),
    h('details', { class: 'adv' }, h('summary', {}, 'More details', h('span', { class: 'hint' }, 'all optional')), h('div', { class: 'in' },
      h('div', { class: 'sec-lbl lbl' }, 'About the product'),
      h('div', { class: 'grid2' }, field('Category', 'f_cat'), field('Seller / brand', 'f_seller', {})),
      field('Website', 'f_web', { ph: 'https://' }), field('Description / notes', 'f_notes', { area: true, rows: 4, ph: 'what it is, who buys it, what makes it different' }),
      h('div', { class: 'grid2' }, field('Target city / market', 'f_city', { ph: 'India' }), field('Tone', 'f_tone', { ph: 'warm, never pushy' })),
      field('Audience', 'f_aud'),
      h('label', { class: 'lbl' }, 'Languages'),
      h('div', { class: 'row' }, ...['en', 'hi', 'hinglish'].map((l) => h('label', { class: 'row' }, h('input', { type: 'checkbox', id: 'l_' + l, checked: true, disabled: l === 'en' }), l))),
      h('div', { class: 'sec-lbl lbl' }, 'Price and offer'),
      h('div', { class: 'grid2' }, field('List price', 'f_list', { type: 'number', min: 0 }), field('Offer price', 'f_offer', { type: 'number', min: 0 })),
      h('div', { class: 'grid2' }, field('What one price covers', 'f_unit', { ph: 'per month' }), field('Offer validity (only if real)', 'f_validity')),
      h('div', { class: 'sec-lbl lbl' }, 'Economics (never invented: leave empty for no negotiation)'),
      h('div', { class: 'grid2' }, field('Floor (lowest acceptable price)', 'f_floor', { type: 'number', min: 0 }), field('or Cost', 'f_cost', { type: 'number', min: 0 })),
      field('Minimum margin % (with cost)', 'f_margin', { type: 'number', min: 0 }), field('Allowed value perks (one per line)', 'f_perks', { area: true, rows: 2 }),

  try { await post('/api/productgen/approve-gaps', { product_id: S.product.product_id, tenant: S.product.tenant, version, approve: ids, reject: rej, publish }); await loadGaps(); await loadVersions(); await loadProducts(); } catch (e) { S.err = e.message; }
  render();
}
async function rejectAll(version) {
  const ids = [...document.querySelectorAll('input.sel')].filter((x) => +x.dataset.v === version).map((x) => x.dataset.id);
  try { await post('/api/productgen/approve-gaps', { product_id: S.product.product_id, tenant: S.product.tenant, version, approve: [], reject: ids }); await loadGaps(); } catch (e) { S.err = e.message; }
  render();
}

/* ---------------------------------------------------------------- shell */
function render() {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === S.tab));
  const app = document.getElementById('app');
  if (!S.defaults) { app.replaceChildren(h('div', { class: 'empty' }, S.err || 'Loading...')); return; }
  const keep = S.tab === 'gen' && document.getElementById('f_name') ? snapshotForm() : null;
  if (S.tab === 'gen') {
    app.replaceChildren(h('div', { class: 'wrap' }, h('div', { class: 'col left', id: 'formcol' }, S.defaults.llm_configured ? null : h('div', { class: 'err' }, 'No model endpoint is configured on this server (PRODUCTGEN_BASE_URL / PRODUCTGEN_MODEL, or the ACIE_EXPR_* settings). Generation will be refused.'), genForm()),
      h('div', { class: 'col' }, h('div', { id: 'jobbox' }), S.job && S.job.status === 'done' || !S.job ? versionPanel() : null)));
    if (keep) restoreForm(keep);
    renderJob();
  } else if (S.tab === 'ver') app.replaceChildren(versionsTab());
  else app.replaceChildren(gapsTab());
}
function snapshotForm() { const o = {}; document.querySelectorAll('#formcol input,#formcol textarea').forEach((e) => { o[e.id] = e.type === 'checkbox' ? e.checked : e.value; }); return o; }
function restoreForm(o) { for (const [k, v] of Object.entries(o)) { const e = document.getElementById(k); if (e) { if (e.type === 'checkbox') e.checked = v; else e.value = v; } } }

document.querySelectorAll('.tab').forEach((t) => t.onclick = async () => { S.tab = t.dataset.tab; S.err = ''; if (S.tab === 'gaps') await loadGaps().catch((e) => { S.err = e.message; }); render(); });
document.getElementById('prodsel').onchange = async (ev) => {
  const [tenant, pid] = ev.target.value.split('/');
  if (!pid) return;
  S.product = { tenant, product_id: pid };
  await loadVersions();
  await openVersion(S.versions[S.versions.length - 1].version);
  S.gaps = null; S.err = ''; render();
};
(async () => {
  try {
    S.defaults = await api('/api/productgen/defaults');
    await loadProducts();
    const q = new URLSearchParams(location.search).get('product');  // deep link: /productgen?product=tenant/product-id
    if (q && q.includes('/')) {
      const [tenant, pid] = q.split('/');
      S.product = { tenant, product_id: pid };
      await loadVersions();
      if (S.versions.length) await openVersion(S.versions[S.versions.length - 1].version);
      await loadProducts();
    }
  } catch (e) { S.err = S.err || e.message; }
  render();
  prefillFromConsole();
})();
/* Hand-off from the console onboarding: /productgen?project=ID&name=NAME&return=/%23/onboarding */
function prefillFromConsole() {
  const q = new URLSearchParams(location.search), project = q.get('project'), name = q.get('name'), back = q.get('return');
  const set = (id, v) => { const el = document.getElementById(id); if (el && v && !el.value) el.value = v; };
  set('f_tenant', project); set('f_name', name);
  if (back && back.startsWith('/') && !back.startsWith('//')) document.getElementById('backlink').href = back;
  if (project) document.getElementById('crumb').textContent = '/ ' + project + ' / Add a product';
}
</script>
