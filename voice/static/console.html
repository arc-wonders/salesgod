<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(Math.min(screen.width,innerWidth)<760&&!/desktop=1/.test(location.search))location.replace('/m')</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SalesGod Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* SalesGod console. Tokens and shell follow the GroundSet Motion product shell (product-shell.css, flow-builder.css):
   dark-first neutral palette, one orange signal accent, Geist / Geist Mono, quiet borders. */
:root{
  --bg:220 10% 5.7%;--fg:60 8% 92%;--muted:216 5% 65%;--tertiary:217 5% 50%;--body:216 6% 72%;
  --rule:210 9% 13.5%;--rule-strong:214 8% 18%;--rule-heavy:216 8% 25%;
  --panel:214 12% 8%;--elevated:216 10% 10.5%;--sidebar:220 10% 5.7%;--hover:210 9% 12.5%;--field:216 11% 7.5%;
  --signal:16 100% 56%;--on-signal:220 10% 6%;--green:153 44% 49%;--amber:38 85% 55%;--red:358 70% 62%;--blue:216 70% 66%;--slate:217 12% 60%;--violet:262 60% 70%;
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,monospace;
  --r-sm:6px;--r:8px;--r-lg:12px;--shadow:0 18px 50px hsl(220 20% 1%/.45);
  color-scheme:dark;
}
.light{
  --bg:45 14% 96%;--fg:220 10% 9%;--muted:220 5% 36%;--tertiary:220 4% 46%;--body:220 6% 24%;
  --rule:40 8% 86%;--rule-strong:40 6% 78%;--rule-heavy:40 6% 68%;
  --panel:45 18% 99%;--elevated:45 12% 94%;--sidebar:45 12% 93%;--hover:40 10% 89%;--field:0 0% 100%;
  --signal:16 100% 50%;--on-signal:0 0% 100%;--green:153 45% 32%;--amber:38 80% 36%;--red:358 65% 46%;--blue:216 55% 45%;--slate:217 12% 42%;--violet:262 45% 50%;
  --shadow:0 18px 50px hsl(40 10% 30%/.18);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:hsl(var(--bg));color:hsl(var(--fg));font-family:var(--font);font-size:13.5px;line-height:1.5;font-feature-settings:'ss01','tnum';-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid hsl(var(--signal)/.8);outline-offset:2px}
::selection{background:hsl(var(--signal)/.3)}
.mono{font-family:var(--mono)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}

/* ------------------------------------------------------------ shell */
.gs{display:flex;height:100dvh;overflow:hidden}
.side{display:flex;flex:0 0 232px;flex-direction:column;height:100dvh;border-right:1px solid hsl(var(--rule));background:hsl(var(--sidebar))}
.brand{display:flex;align-items:center;gap:10px;height:56px;flex:0 0 56px;padding:0 18px;border-bottom:1px solid hsl(var(--rule))}
.brand .mk{width:20px;height:20px;border-radius:5px;background:hsl(var(--signal));display:grid;place-items:center}
.brand .mk i{width:8px;height:8px;border-radius:50%;background:hsl(var(--bg))}
.brand b{font-weight:600;font-size:14px;letter-spacing:-.02em}
.brand small{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:hsl(var(--tertiary));text-transform:uppercase;margin-left:auto}
.nav{flex:1;overflow-y:auto;padding:12px 12px 16px}
.group{margin-top:18px;padding:0 10px 6px;color:hsl(var(--tertiary));font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.group:first-child{margin-top:0}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;height:34px;margin-bottom:2px;padding:0 10px;border:0;border-radius:var(--r-sm);background:transparent;color:hsl(var(--muted));font-size:13px;font-weight:450;text-align:left;cursor:pointer;text-decoration:none;transition:color .15s,background .15s}
.nav-item svg{color:hsl(var(--tertiary))}
.nav-item:hover{background:hsl(var(--panel));color:hsl(var(--fg))}
.nav-item.on{background:hsl(var(--elevated));color:hsl(var(--fg));font-weight:500;box-shadow:inset 0 0 0 1px hsl(var(--rule))}
.nav-item.on svg{color:hsl(var(--fg))}
.nav-item.on::before{content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:2px;border-radius:0 2px 2px 0;background:hsl(var(--signal))}
.nav-item .cnt{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:hsl(var(--green))}
.nav-item .cnt:not(:empty)::before{content:'';width:6px;height:6px;border-radius:50%;background:hsl(var(--green));box-shadow:0 0 0 3px hsl(var(--green)/.18)}
.side-foot{padding:8px 12px 12px;border-top:1px solid hsl(var(--rule));position:relative}
.org{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:var(--r);background:transparent;text-align:left;cursor:pointer}
.org:hover{border-color:hsl(var(--rule-strong));background:hsl(var(--panel))}
.org .dot{width:10px;height:10px;flex:0 0 10px;border-radius:3px}
.org b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org small{display:block;color:hsl(var(--tertiary));font-size:11px}
.menu{position:absolute;left:10px;right:10px;bottom:calc(100% - 4px);background:hsl(var(--panel));border:1px solid hsl(var(--rule-strong));border-radius:var(--r-lg);padding:6px;box-shadow:var(--shadow);z-index:40}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;border-radius:var(--r-sm);background:none;cursor:pointer;text-align:left;font-size:13px}
.menu button:hover{background:hsl(var(--hover))}
.menu .sep{height:1px;background:hsl(var(--rule));margin:5px 0}
.main{display:flex;min-width:0;flex:1;flex-direction:column}
.topbar{display:flex;height:56px;flex:0 0 56px;align-items:center;gap:10px;padding:0 20px 0 24px;border-bottom:1px solid hsl(var(--rule));background:hsl(var(--bg)/.94);backdrop-filter:blur(12px)}
.crumbs{display:flex;min-width:0;flex:1;align-items:center;gap:8px;color:hsl(var(--tertiary));font-size:13px;white-space:nowrap;overflow:hidden}
.crumbs i{font-style:normal;color:hsl(var(--rule-heavy))}
.crumbs b{color:hsl(var(--fg));font-weight:500;overflow:hidden;text-overflow:ellipsis}
.icon-btn{display:grid;flex:0 0 34px;width:34px;height:34px;place-items:center;border:1px solid hsl(var(--rule-strong));border-radius:999px;background:transparent;color:hsl(var(--muted));cursor:pointer}
.icon-btn:hover{border-color:hsl(var(--rule-heavy));color:hsl(var(--fg))}
.conn{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;font-size:11.5px;color:hsl(var(--tertiary));white-space:nowrap}
.conn i{width:7px;height:7px;border-radius:50%;background:hsl(var(--tertiary))}
.conn.ok i{background:hsl(var(--green));box-shadow:0 0 0 3px hsl(var(--green)/.18)}
.conn.bad i{background:hsl(var(--amber))}
.content{flex:1;min-height:0;overflow:auto}
.pad{max-width:1320px;margin:0 auto;padding:28px 32px 64px}
.flush{height:100%;display:flex;flex-direction:column;min-height:0}
.head{padding:20px 28px 16px;border-bottom:1px solid hsl(var(--rule));display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pad .head{padding:0 0 20px;margin-bottom:24px}
.head.compact{padding:14px 28px;align-items:center}
.pad .head.compact{padding:0 0 18px}
.head h1{margin:0;font-size:22px;font-weight:550;letter-spacing:-.025em;line-height:1.25}
.head p{max-width:680px;margin:6px 0 0;color:hsl(var(--muted));font-size:13.5px;line-height:1.6}
.head .sp{flex:1}
.head .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ------------------------------------------------------------ controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border:1px solid hsl(var(--rule-strong));border-radius:999px;background:hsl(var(--panel));color:hsl(var(--fg));font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,filter .15s}
.btn:hover{border-color:hsl(var(--rule-heavy));background:hsl(var(--elevated))}
.btn.pri{background:hsl(var(--signal));border-color:hsl(var(--signal));color:hsl(var(--on-signal))}
.btn.pri:hover{filter:brightness(1.07);background:hsl(var(--signal))}
.btn.sm{height:28px;padding:0 11px;font-size:12.5px;gap:6px}
.btn.lg{height:40px;padding:0 18px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:hsl(var(--muted))}
.btn.ghost:hover{color:hsl(var(--fg));background:hsl(var(--hover))}
.btn.danger{color:hsl(var(--red))}
.btn.danger:hover{border-color:hsl(var(--red)/.5);background:hsl(var(--red)/.08)}
.btn.pri.danger{background:hsl(var(--red));border-color:hsl(var(--red));color:#fff}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.block{width:100%}
input,select,textarea{width:100%;height:36px;padding:0 11px;border:1px solid hsl(var(--rule-strong));border-radius:var(--r);background:hsl(var(--field));font-size:13.5px;transition:border-color .15s,box-shadow .15s}
select{padding-right:30px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,hsl(var(--tertiary)) 50%),linear-gradient(135deg,hsl(var(--tertiary)) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10.5px) 52%;background-size:4.5px 4.5px;background-repeat:no-repeat}
textarea{height:auto;padding:9px 11px;resize:vertical;line-height:1.55}
input[type=checkbox],input[type=radio]{width:16px;height:16px;padding:0;accent-color:hsl(var(--signal));flex:none}
input[type=color]{padding:3px}
input::placeholder,textarea::placeholder{color:hsl(var(--tertiary))}
input:hover,select:hover,textarea:hover{border-color:hsl(var(--rule-heavy))}
input:focus,select:focus,textarea:focus{outline:0;border-color:hsl(var(--signal)/.8);box-shadow:0 0 0 3px hsl(var(--signal)/.15)}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
.invalid,input.invalid,textarea.invalid,select.invalid{border-color:hsl(var(--red))!important;box-shadow:0 0 0 3px hsl(var(--red)/.12)}
select.inline{width:auto}
.lbl{display:block;margin:16px 0 6px;color:hsl(var(--body));font-size:12.5px;font-weight:500;letter-spacing:0}
.lbl .opt{color:hsl(var(--tertiary));font-weight:400}
.hint{color:hsl(var(--tertiary));font-size:12.5px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.row{display:flex;gap:8px;align-items:center}
.err{color:hsl(var(--red));font-size:13px;margin-top:10px;white-space:pre-wrap}
.err:empty{display:none}
.err:not(:empty){padding:9px 12px;border:1px solid hsl(var(--red)/.35);border-radius:var(--r);background:hsl(var(--red)/.07)}
.ferr{color:hsl(var(--red));font-size:12px;margin-top:5px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px solid hsl(var(--rule-strong));border-radius:999px;font-size:11.5px;font-weight:450;color:hsl(var(--muted));white-space:nowrap;background:hsl(var(--panel))}
.tag b{font-weight:500;color:hsl(var(--fg))}
.tag.sig{color:hsl(var(--signal));border-color:hsl(var(--signal)/.35);background:hsl(var(--signal)/.08)}
.tag.green{color:hsl(var(--green));border-color:hsl(var(--green)/.35);background:hsl(var(--green)/.08)}
.tag.red{color:hsl(var(--red));border-color:hsl(var(--red)/.35);background:hsl(var(--red)/.08)}
.tag.amber{color:hsl(var(--amber));border-color:hsl(var(--amber)/.35);background:hsl(var(--amber)/.08)}
.tag.blue{color:hsl(var(--blue));border-color:hsl(var(--blue)/.35);background:hsl(var(--blue)/.08)}
.tag.sig b,.tag.green b,.tag.red b,.tag.amber b,.tag.blue b{color:inherit}
.sec-lbl{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--tertiary))}
.empty{padding:48px 24px;text-align:center;color:hsl(var(--tertiary));font-size:13px;line-height:1.6}
.empty b{display:block;color:hsl(var(--fg));font-size:14.5px;font-weight:500;margin-bottom:4px}
.empty .btn{margin-top:14px}
.seg{display:inline-flex;padding:2px;border:1px solid hsl(var(--rule-strong));border-radius:999px;background:hsl(var(--field));gap:2px}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border:0;border-radius:999px;background:none;color:hsl(var(--muted));font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button:hover{color:hsl(var(--fg))}
.seg button.on{background:hsl(var(--elevated));color:hsl(var(--fg));box-shadow:inset 0 0 0 1px hsl(var(--rule-heavy))}
.seg.full{display:flex}.seg.full button{flex:1}
.check{display:flex;align-items:flex-start;gap:9px;margin-top:14px;font-size:13px;color:hsl(var(--body));cursor:pointer}
.check input{margin-top:1px}

/* status badge: one look for every call status */
.st{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;text-transform:capitalize;color:hsl(var(--tertiary));background:hsl(var(--elevated));white-space:nowrap}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.st.live{color:hsl(var(--green));background:hsl(var(--green)/.12)}
.st.ringing,.st.dialing{color:hsl(var(--amber));background:hsl(var(--amber)/.12)}
.st.failed{color:hsl(var(--red));background:hsl(var(--red)/.1)}
.pulse{width:7px;height:7px;border-radius:50%;background:hsl(var(--green));animation:pl 1.6s infinite;flex:none}
@keyframes pl{0%{box-shadow:0 0 0 0 hsl(var(--green)/.55)}100%{box-shadow:0 0 0 8px hsl(var(--green)/0)}}

/* ------------------------------------------------------------ calls (live) */
div.live{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) minmax(360px,32%);position:relative}
.live>section{min-height:0;overflow-y:auto;overflow-x:hidden;border-right:1px solid hsl(var(--rule))}
.live>section:last-child{border-right:0;background:hsl(var(--panel))}
.pane-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 16px;border-bottom:1px solid hsl(var(--rule));background:hsl(var(--bg)/.96);backdrop-filter:blur(8px)}
.live>section:last-child .pane-head{background:hsl(var(--panel)/.96)}
.pane-head .ttl{font-weight:550;font-size:13.5px}
.pane-head .cnt2{font-size:12px;color:hsl(var(--tertiary))}
.lfilter{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid hsl(var(--rule))}
.lfilter .seg{width:100%}.lfilter .seg button{flex:1}
.ci{display:block;width:100%;padding:12px 16px;border:0;border-bottom:1px solid hsl(var(--rule));background:none;text-align:left;cursor:pointer;position:relative}
.ci:hover{background:hsl(var(--panel))}
.ci.on{background:hsl(var(--elevated))}
.ci.on::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:0 2px 2px 0;background:hsl(var(--signal))}
.ci .t{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;min-width:0}
.ci .t>span:not(.st):not(.pulse){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .m{margin-top:3px;color:hsl(var(--tertiary));font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callhead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid hsl(var(--rule));background:hsl(var(--bg)/.96);backdrop-filter:blur(8px)}
.callhead .who2{min-width:0;flex:1}
.callhead .nm{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:550;letter-spacing:-.01em}
.callhead .nm .st{margin-left:0}
.callhead .meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;color:hsl(var(--tertiary));font-size:12.5px}
.callhead .meta span{white-space:nowrap}
.callhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.ins-toggle{display:none}
.endnote{margin:6px 0 0 40px;padding:8px 12px;border-radius:var(--r);background:hsl(var(--elevated));color:hsl(var(--muted));font-size:12.5px;align-self:flex-start}
.tx{padding:22px 24px 48px;display:flex;flex-direction:column;gap:18px;max-width:860px}
.turn{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.turn .who{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:11px;font-weight:600;background:hsl(var(--elevated));color:hsl(var(--muted));box-shadow:inset 0 0 0 1px hsl(var(--rule-strong))}
.turn.a .who{background:hsl(var(--signal)/.12);color:hsl(var(--signal));box-shadow:inset 0 0 0 1px hsl(var(--signal)/.3)}
.turn .wl{display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-weight:550;color:hsl(var(--fg));margin-bottom:2px}
.turn .wl small{font-weight:400;color:hsl(var(--tertiary));font-size:12px}
.turn .txt{font-size:14px;line-height:1.6;color:hsl(var(--fg));overflow-wrap:anywhere}
.turn.c .txt{color:hsl(var(--body))}
.turn .txt.interim{color:hsl(var(--tertiary));font-size:13px}
.turn .sub{margin-top:4px;font-size:12px;color:hsl(var(--tertiary))}
.listening{display:flex;align-items:center;gap:8px;margin-left:40px;color:hsl(var(--tertiary));font-size:12.5px}
.listening i{width:6px;height:6px;border-radius:50%;background:hsl(var(--green));animation:pl 1.6s infinite}
.dec{margin-top:10px;border:1px solid hsl(var(--rule));border-radius:var(--r-lg);background:hsl(var(--panel));overflow:hidden}
.dec .r1{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
.dec .r1 .tag{background:transparent;max-width:100%;min-width:0}.dec .r1 .tag b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dec .r3{padding:0 12px 10px;font-size:13px;color:hsl(var(--body));line-height:1.55}
.dec .r3 em{color:hsl(var(--tertiary));font-style:normal;font-size:12px;font-weight:500;margin-right:6px}
.dec details{border-top:1px solid hsl(var(--rule))}
.dec details>summary{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;list-style:none;font-size:12px;color:hsl(var(--tertiary));user-select:none}
.dec details>summary::-webkit-details-marker{display:none}
.dec details>summary::before{content:'';width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.dec details[open]>summary::before{transform:rotate(45deg)}
.dec details>summary:hover{color:hsl(var(--fg))}
.dec details>summary .mini{margin-left:auto;display:flex;gap:10px;font-family:var(--mono);font-size:11px}
.dec .r2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:4px 12px 12px}
.dec .notes{margin:0;padding:0 12px 12px;white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;color:hsl(var(--muted))}
.meter{font-size:11.5px;color:hsl(var(--tertiary));display:flex;justify-content:space-between;gap:6px}
.meter b{color:hsl(var(--fg));font-weight:500;font-family:var(--mono)}
.bar{height:4px;margin-top:6px;border-radius:2px;background:hsl(var(--rule-strong));overflow:hidden}
.bar i{display:block;height:100%;background:hsl(var(--signal))}
.bar.red i{background:hsl(var(--red))}.bar.amber i{background:hsl(var(--amber))}.bar.blue i{background:hsl(var(--blue))}
.path{padding:14px 16px}
.step{position:relative;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r);color:hsl(var(--tertiary));font-size:13px}
.step .n{width:18px;font-family:var(--mono);font-size:11px;color:hsl(var(--tertiary))}
.step.passed{color:hsl(var(--muted))}
.step.hot{background:hsl(var(--signal)/.1);color:hsl(var(--fg));box-shadow:inset 0 0 0 1px hsl(var(--signal)/.45)}
.step.hot .n{color:hsl(var(--signal))}
.leaf{margin:4px 0 6px 28px;padding:10px 12px;border:1px solid hsl(var(--signal)/.45);border-radius:var(--r);background:hsl(var(--signal)/.06);font-size:13px}
.leaf .k{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:hsl(var(--signal))}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;padding:14px 16px;margin:0;border-top:1px solid hsl(var(--rule));font-size:13px}
.kv dt{color:hsl(var(--tertiary));font-size:12.5px}
.kv dd{margin:0;overflow-wrap:anywhere}

/* ------------------------------------------------------------ decision tree */
.tree{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.canvas{position:relative;overflow:hidden;cursor:grab;touch-action:none;background-color:hsl(var(--bg));background-image:radial-gradient(hsl(var(--rule-strong)) 1px,transparent 1px);background-size:20px 20px}
.canvas.drag{cursor:grabbing}
.layer{position:absolute;left:0;top:0;transform-origin:0 0}
.layer svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:hsl(var(--rule-heavy));stroke-width:1.4}
.edge.hot{stroke:hsl(var(--signal));stroke-width:2.2;stroke-dasharray:6 5;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
.nd{position:absolute;width:212px;border:1px solid hsl(var(--rule-strong));border-radius:10px;background:hsl(var(--panel));padding:9px 11px 8px;box-shadow:0 1px 2px rgba(0,0,0,.18);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.nd::before{content:'';position:absolute;left:-1px;top:10px;bottom:10px;width:2px;border-radius:0 2px 2px 0;background:var(--kind)}
.nd:hover{border-color:hsl(var(--rule-heavy))}
.nd .k{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--kind)}
.nd .t{margin-top:3px;font-size:13px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd .m{margin-top:2px;font-size:11.5px;color:hsl(var(--tertiary));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd.sel{border-color:hsl(var(--blue));box-shadow:0 0 0 3px hsl(var(--blue)/.18)}
.nd.hot{border-color:hsl(var(--signal));box-shadow:0 0 0 3px hsl(var(--signal)/.22),0 0 24px hsl(var(--signal)/.25)}
.nd.new{border-style:dashed;border-color:hsl(var(--green))}
.nd.dirty .k::after{content:'edited';margin-left:auto;color:hsl(var(--amber));letter-spacing:.08em}
.k-root{--kind:hsl(var(--signal))}.k-gate{--kind:hsl(var(--slate))}.k-gate-safety{--kind:hsl(var(--red))}.k-gate-compliance{--kind:hsl(var(--blue))}.k-gate-close{--kind:hsl(var(--green))}.k-gate-conversation{--kind:hsl(var(--amber))}
.k-node{--kind:hsl(var(--violet))}.k-free{--kind:hsl(var(--tertiary))}
.col-lbl{position:absolute;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--tertiary));white-space:nowrap}
.tools{position:absolute;top:12px;left:12px;right:12px;z-index:5;display:flex;align-items:center;gap:6px;flex-wrap:wrap;pointer-events:none}
.tools>*{pointer-events:auto}
.tools .btn{background:hsl(var(--panel))}
.tools .btn.pri{background:hsl(var(--signal))}
.zoom{position:absolute;left:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;border:1px solid hsl(var(--rule-strong));border-radius:var(--r);overflow:hidden;background:hsl(var(--panel))}
.zoom button{display:grid;place-items:center;width:32px;height:30px;border:0;border-bottom:1px solid hsl(var(--rule));background:none;cursor:pointer;color:hsl(var(--muted))}
.zoom button:last-child{border-bottom:0}
.zoom button:hover{color:hsl(var(--fg));background:hsl(var(--hover))}
.legend{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;gap:12px;padding:7px 11px;border:1px solid hsl(var(--rule));border-radius:var(--r);background:hsl(var(--panel)/.92);font-size:11.5px;color:hsl(var(--tertiary))}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.insp{border-left:1px solid hsl(var(--rule));background:hsl(var(--panel));overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.insp-head{padding:18px 20px 14px;border-bottom:1px solid hsl(var(--rule))}
.insp-head .k{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--kind)}
.insp-head h3{margin:4px 0 0;font-size:15.5px;font-weight:550;letter-spacing:-.01em}
.insp-head p{margin:6px 0 0;color:hsl(var(--muted));font-size:13px;line-height:1.6}
.insp-body{padding:4px 20px 22px;flex:1}
.insp-foot{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 20px;border-top:1px solid hsl(var(--rule));background:hsl(var(--panel))}
.pts{margin:8px 0 0;padding:0;list-style:none}
.pts li{position:relative;padding:7px 0 7px 16px;border-bottom:1px solid hsl(var(--rule));font-size:13px;color:hsl(var(--body))}
.pts li:last-child{border-bottom:0}
.pts li::before{content:'';position:absolute;left:2px;top:14px;width:5px;height:5px;border-radius:50%;background:hsl(var(--signal))}

/* ------------------------------------------------------------ simulator */
.sim{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.sim>section{min-height:0;display:flex;flex-direction:column;border-right:1px solid hsl(var(--rule))}
.sim>section:last-child{border-right:0;background:hsl(var(--panel));overflow:auto;display:block}
.sim .bar-top{display:flex;gap:8px;align-items:center;padding:12px 24px;border-bottom:1px solid hsl(var(--rule));flex-wrap:wrap}
.sim .scroll{flex:1;overflow:auto}
.composer{display:flex;gap:8px;padding:12px 24px;border-top:1px solid hsl(var(--rule));background:hsl(var(--bg))}
.composer input{height:40px;border-radius:999px;padding:0 18px}
.composer .btn{height:40px}

/* ------------------------------------------------------------ progress / panels */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid hsl(var(--rule));border-radius:var(--r-lg);overflow:hidden;background:hsl(var(--panel))}
.strip>div{padding:16px 18px;border-right:1px solid hsl(var(--rule));border-bottom:1px solid hsl(var(--rule))}
.strip>div:nth-child(4n){border-right:0}
.strip>div:nth-last-child(-n+4){border-bottom:0}
.strip .v{font-size:24px;font-weight:550;letter-spacing:-.03em;line-height:1.1}
.strip .k{margin-top:5px;font-size:12px;color:hsl(var(--tertiary))}
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:22px 24px;margin-bottom:16px;border:1px solid hsl(var(--rule));border-radius:var(--r-lg);background:hsl(var(--panel))}
.hero .v{font-size:44px;font-weight:550;letter-spacing:-.04em;line-height:1}
.hero .v small{font-size:20px;color:hsl(var(--tertiary))}
.big{height:6px;border-radius:3px;background:hsl(var(--rule-strong));overflow:hidden}
.big i{display:block;height:100%;background:hsl(var(--signal));transition:width .6s}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;margin-top:16px;align-items:start}
.panel{border:1px solid hsl(var(--rule));border-radius:var(--r-lg);background:hsl(var(--panel));overflow:hidden}
.panel+.panel{margin-top:16px}
.panel-head{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 18px;border-bottom:1px solid hsl(var(--rule))}
.panel-head b{font-weight:550;font-size:13.5px}
.panel-head .tag{margin-left:auto}
.panel-head .hint{font-weight:400}
.panel-body{padding:4px 18px 18px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 140px 44px;gap:12px;align-items:center;padding:9px 18px;border-bottom:1px solid hsl(var(--rule));font-size:13px}
.item:last-child{border-bottom:0}
.item .p{height:4px;border-radius:2px;background:hsl(var(--rule-strong));overflow:hidden}
.item .p i{display:block;height:100%;background:hsl(var(--green))}
.item .p i.mid{background:hsl(var(--amber))}.item .p i.low{background:hsl(var(--red))}
.item .n{font-family:var(--mono);font-size:12px;color:hsl(var(--muted));text-align:right}
.log{padding:11px 18px;border-bottom:1px solid hsl(var(--rule));font-size:13px;color:hsl(var(--body))}
.log:last-child{border-bottom:0}
.log .d{font-family:var(--mono);font-size:11px;color:hsl(var(--tertiary))}

/* ------------------------------------------------------------ cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;width:100%;padding:18px;border:1px solid hsl(var(--rule));border-radius:var(--r-lg);background:hsl(var(--panel));text-align:left;position:relative;transition:border-color .15s}
.pcard:hover{border-color:hsl(var(--rule-heavy))}
.pcard .k{font-size:12px;font-weight:450;color:hsl(var(--tertiary))}
.pcard b{display:block;margin-top:2px;font-size:15.5px;font-weight:550;letter-spacing:-.01em}
.pcard dl{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;margin:14px 0 0;font-size:13px}
.pcard dt{color:hsl(var(--tertiary));font-size:12.5px}
.pcard dd{margin:0;overflow-wrap:anywhere}
.pcard .foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:16px}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-top:12px}
.price .now{font-size:18px;font-weight:550;letter-spacing:-.02em}
.price s{color:hsl(var(--tertiary));font-size:13px}

/* ------------------------------------------------------------ modal + drawer */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:min(10vh,90px) 16px 20px;background:hsl(220 20% 2%/.62);backdrop-filter:blur(3px)}
.light .modal{background:hsl(40 10% 20%/.35)}
.dialog{display:flex;flex-direction:column;width:min(600px,100%);max-height:84vh;border:1px solid hsl(var(--rule-strong));border-radius:14px;background:hsl(var(--panel));box-shadow:var(--shadow);animation:pop .16s ease-out both;overflow:hidden}
.dialog.wide{width:min(760px,100%)}
.dialog .dh{position:relative;padding:18px 52px 14px 22px;border-bottom:1px solid hsl(var(--rule));flex:none}
.dialog .dh h3{margin:0;font-size:16px;font-weight:550;letter-spacing:-.01em}
.dialog .dh p{margin:4px 0 0;color:hsl(var(--muted));font-size:13px}
.dialog .x{position:absolute;right:14px;top:14px;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:var(--r-sm);background:none;color:hsl(var(--tertiary));cursor:pointer}
.dialog .x:hover{background:hsl(var(--hover));color:hsl(var(--fg))}
.dialog .db{padding:6px 22px 20px;overflow:auto;flex:1;min-height:0}
.dialog .df{display:flex;gap:8px;align-items:center;padding:12px 22px;border-top:1px solid hsl(var(--rule));background:hsl(var(--panel));flex:none}
.dialog .df:empty{display:none}
.modal.drawer{justify-content:flex-end;align-items:stretch;padding:0}
.modal.drawer .dialog{width:min(460px,100%);max-height:none;height:100%;border-radius:0;border-width:0 0 0 1px;animation:slide .2s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:.4;transform:translateX(24px)}to{opacity:1;transform:none}}
.fsec{margin-top:22px;padding-top:4px}
.fsec:first-child{margin-top:4px}
.fsec>.sec-lbl{display:block;margin-bottom:-4px}
.login{min-height:100dvh;display:grid;place-items:center;padding:16px}
.login .box{width:min(380px,100%);border:1px solid hsl(var(--rule-strong));border-radius:16px;background:hsl(var(--panel));padding:28px}
.login h1{margin:18px 0 4px;font-size:21px;font-weight:550;letter-spacing:-.02em}
.enter{animation:enter .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* new call results */
.nres{margin-top:16px;border:1px solid hsl(var(--rule));border-radius:var(--r-lg);overflow:hidden}
.nres .sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid hsl(var(--rule));background:hsl(var(--elevated));font-size:12.5px;color:hsl(var(--muted))}
.nres .one{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 14px;border-bottom:1px solid hsl(var(--rule))}
.nres .one:last-child{border-bottom:0}
.nres .ico{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.nres .ico svg{width:12px;height:12px;stroke-width:2.4}
.nres .ok .ico{background:hsl(var(--green)/.15);color:hsl(var(--green))}
.nres .warn .ico{background:hsl(var(--amber)/.15);color:hsl(var(--amber))}
.nres .bad .ico{background:hsl(var(--red)/.14);color:hsl(var(--red))}
.nres .num{font-family:var(--mono);font-size:12.5px}
.nres .msg{font-size:12.5px;color:hsl(var(--muted));margin-top:2px;overflow-wrap:anywhere}
.nres .warn .msg{color:hsl(var(--amber))}.nres .bad .msg{color:hsl(var(--red))}
.ctxbox:empty{display:none}.ctxbox{padding:14px 18px;border-bottom:1px solid hsl(var(--rule))}
.turn.pick{cursor:pointer;border-radius:var(--r-lg);margin:-6px -8px;padding:6px 8px;transition:background .15s}
.turn.pick:hover{background:hsl(var(--panel))}
.turn.sel{background:hsl(var(--signal)/.06);box-shadow:inset 2px 0 0 hsl(var(--signal))}
.turnnav{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid hsl(var(--rule))}
.turnnav b{font-weight:550;font-size:13px}
.leaf.plan{margin-left:0;margin-top:10px;border-color:hsl(var(--rule-strong));background:hsl(var(--bg))}.leaf.plan .k{color:hsl(var(--tertiary))}
.haggle .hg-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}.haggle .hg-head b{font-weight:550}
.hg-chart{display:block;width:100%;height:auto;overflow:visible}.hg-chart text{font-family:var(--mono);font-size:9px;fill:hsl(var(--tertiary))}
.hg-ref{stroke:hsl(var(--rule-heavy));stroke-dasharray:3 4}.hg-a{fill:none;stroke:hsl(var(--signal));stroke-width:1.6}.hg-c{fill:none;stroke:hsl(var(--blue));stroke-width:1.6;stroke-dasharray:5 3}
.hg-ad{fill:hsl(var(--signal))}.hg-cd{fill:hsl(var(--blue))}.hg-ok{fill:hsl(var(--green));stroke:hsl(var(--green)/.35);stroke-width:4}
.hgk{display:inline-block;width:10px;height:3px;border-radius:2px}.hgk.a{background:hsl(var(--signal))}.hgk.c{background:hsl(var(--blue))}.hgk.ok{width:8px;height:8px;border-radius:50%;background:hsl(var(--green))}
.hg-rows{display:grid;gap:2px;font-size:12.5px}.hg-row{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;padding:3px 0;border-bottom:1px dashed hsl(var(--rule))}.hg-row:last-child{border-bottom:0}.hg-cv{color:hsl(var(--blue))}.hg-av{color:hsl(var(--signal))}
.hg-ck{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ck{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:hsl(var(--tertiary))}.ck i{display:grid;place-items:center;width:15px;height:15px;border-radius:4px;border:1.5px solid hsl(var(--rule-heavy));font-style:normal;font-size:10px}.ck.on{color:hsl(var(--fg))}.ck.on i{background:hsl(var(--green));border-color:hsl(var(--green));color:hsl(var(--bg))}
.numchk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ------------------------------------------------------------ live information map + negotiation editor */
div.live.wide{grid-template-columns:300px minmax(0,1fr) minmax(380px,36%)}
.rtabs{display:flex;gap:2px;margin-left:auto;padding:2px;border:1px solid hsl(var(--rule-strong));border-radius:999px;background:hsl(var(--field))}
.rtabs button{height:26px;padding:0 11px;border:0;border-radius:999px;background:none;color:hsl(var(--muted));font-size:12.5px;font-weight:500;cursor:pointer}
.rtabs button.on{background:hsl(var(--elevated));color:hsl(var(--fg));box-shadow:inset 0 0 0 1px hsl(var(--rule-heavy))}
.imap{padding:16px 18px 36px;display:flex;flex-direction:column;gap:22px}
.imap h4{margin:0 0 8px;font-size:12.5px;font-weight:550;color:hsl(var(--fg));display:flex;align-items:center;gap:8px}
.imap h4 .hint{font-weight:400;font-size:12px}
.imap svg.chart{display:block;width:100%;height:auto;overflow:visible}
.imap svg text{font-family:var(--mono);font-size:8.5px;fill:hsl(var(--tertiary))}
.imap svg text.cur{fill:hsl(var(--signal));font-weight:600}
.imap .mlane{stroke:hsl(var(--rule));stroke-width:1}
.imap .medge{fill:none;stroke:hsl(var(--signal)/.6);stroke-width:1.6;stroke-linejoin:round}
.imap .mdot{fill:hsl(var(--elevated));stroke:hsl(var(--signal));stroke-width:1.5}
.imap .mdot.now{fill:hsl(var(--signal));stroke:hsl(var(--signal)/.35);stroke-width:5}
.layers{display:grid;grid-template-columns:70px minmax(0,1fr);gap:7px 10px;font-size:13px;margin:10px 0 0;padding:11px 13px;border:1px solid hsl(var(--rule));border-radius:var(--r);background:hsl(var(--bg))}
.layers dt{color:hsl(var(--tertiary));font-size:12px;padding-top:2px}
.layers dd{margin:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0;overflow-wrap:anywhere}
.mnd{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none;border:1.5px solid hsl(var(--tertiary)/.6);background:transparent}
.mnd.asked{background:hsl(var(--amber));border-color:hsl(var(--amber))}
.mnd.answered{background:hsl(var(--green));border-color:hsl(var(--green))}
.mnd.recommended{background:hsl(var(--violet));border-color:hsl(var(--violet))}
.mnd.closed{background:hsl(var(--signal));border-color:hsl(var(--signal))}
.mlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:hsl(var(--muted));margin-bottom:8px}
.mlegend span{display:inline-flex;align-items:center;gap:5px}
.mtn{border:1px solid hsl(var(--rule));border-radius:var(--r);background:hsl(var(--bg));margin-bottom:6px}
.mtn>summary{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;list-style:none;font-size:13px}
.mtn>summary::-webkit-details-marker{display:none}
.mtn>summary .mc{margin-left:auto;font-family:var(--mono);font-size:11px;color:hsl(var(--tertiary))}
.mtn .mtn{margin:4px 0 0 6px}
.mtn .mbody{padding:2px 10px 9px}
.men{display:flex;align-items:flex-start;gap:7px;padding:3px 0;font-size:12.5px;color:hsl(var(--muted))}
.men .mnd{margin-top:4px}.men.answered,.men.asked{color:hsl(var(--fg))}
.moffs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.moff{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid hsl(var(--rule-strong));border-radius:999px;font-size:12px}
.moff.recommended{border-color:hsl(var(--violet)/.6)}.moff.closed{border-color:hsl(var(--signal)/.7)}
.mkv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;margin:0;font-size:13px}
.mkv dt{color:hsl(var(--tertiary));font-size:12.5px;padding-top:1px}.mkv dd{margin:0;overflow-wrap:anywhere}
.neg-ed{margin-top:22px;padding:14px 16px 16px;border:1px solid hsl(var(--rule-strong));border-radius:var(--r-lg);background:hsl(var(--elevated))}
.neg-ed.off{opacity:.65}
.neg-ed h4{margin:0 0 2px;font-size:14px;font-weight:550}
.neg-ed .nstep{display:grid;grid-template-columns:22px 92px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid hsl(var(--rule))}
.neg-ed .nstep .nn{font-family:var(--mono);color:hsl(var(--tertiary));padding-top:9px}
.neg-ed .floor{font-family:var(--mono);color:hsl(var(--signal));font-size:12.5px}
.neg-ed .nctl{display:flex;gap:2px}
.neg-ed .nctl button{width:28px;height:30px;border:0;border-radius:var(--r-sm);background:none;color:hsl(var(--muted));cursor:pointer}
.neg-ed .nctl button:hover{background:hsl(var(--hover))}

/* ------------------------------------------------------------ responsive */
@media (max-width:1280px){
  div.live,div.live.wide{grid-template-columns:280px minmax(0,1fr)}
  .live>section.ins{display:none}
  .live.show-ins>section.ins{display:block;position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);z-index:20;border-left:1px solid hsl(var(--rule-strong));box-shadow:var(--shadow)}
  .ins-toggle{display:inline-flex}
  .ins-close{display:inline-flex!important}
}
.ins-close{display:none!important}
@media (max-width:1100px){.tree,.sim{grid-template-columns:1fr}.insp,.sim>section:last-child{display:none}.cols{grid-template-columns:1fr}}
@media (max-width:760px){

    };
    const tone = P.toneField(base.tone_level); F.tone_level = [tone.sel, 'text'];
    const tsel = h('select', {}, S.tenants.map((t) => h('option', { value: t.id, selected: t.id === (base.tenant || S.tenant) }, t.name)));
    F.tenant = [tsel, 'text'];
    /* the persona (GET /api/agents): '' = the project's default agent; its name and voice replace the old free-text agent name */
    const agentSel = h('select', { 'aria-label': 'Agent' }, h('option', { value: '' }, 'Project default'));
    F.agent_id = [agentSel, 'text'];
    const fillAgents = () => api('/api/agents?tenant=' + encodeURIComponent(tsel.value)).then((d) => {
      const def = (d.tenant_defaults || {})[tsel.value] || 'arjun', nm = (a) => a.display_name + ' · ' + a.gender;
      const dA = d.agents.find((a) => a.id === def);
      agentSel.replaceChildren(h('option', { value: '' }, 'Project default' + (dA ? ' (' + nm(dA) + ')' : '')), ...d.agents.map((a) => h('option', { value: a.id, selected: a.id === (base.agent_id || '') }, nm(a))));
    }).catch(() => {});
    tsel.addEventListener('change', fillAgents); fillAgents();
    const collectNow = () => { const o = {}; for (const [k, [el, type]] of Object.entries(F)) o[k] = type === 'lines' ? el.value.split('\n').map((x) => x.trim()).filter(Boolean) : el.value; return o; };
    const applyDraft = (d) => { for (const [k, v] of Object.entries(d)) { const f = F[k]; if (!f) continue; const [el, type] = f; el.value = type === 'lines' ? [].concat(v).join('\n') : type === 'lang' && v && typeof v === 'object' ? ['en', 'hi', 'hinglish'].map((x) => x + ': ' + (v[x] || '')).join('\n') : (v ?? ''); } };
    const sec = (t, ...kids) => h('div', { class: 'fsec' }, h('span', { class: 'sec-lbl' }, t), kids);
    b.append(...flat([
      P ? P.aiBox({ kind: 'product', placeholder: 'e.g. a monthly coffee subscription for office teams in Pune, \u20b9899/month', context: () => ({ project: S.tenant, product: collectNow() }), current: collectNow, apply: applyDraft }) : null,
      sec('Basics',
        !pid ? fld('id', 'Id \u00b7 lowercase letters, digits and -') : null,
        h('div', { class: 'grid2' }, h('div', {}, fld('product_name', 'Product name')), h('div', {}, fld('seller_name', 'Calling for (company)'))),
        h('div', { class: 'grid2' }, h('div', {}, h('label', { class: 'lbl' }, 'Agent (voice and name) \u00b7 Agents page'), agentSel), h('div', {}, h('label', { class: 'lbl' }, 'Project'), tsel))),
      sec('Price and offer',
        h('div', { class: 'grid2' }, h('div', {}, fld('original_price', 'Normal price')), h('div', {}, fld('offer_price', 'Offer price'))),
        h('div', { class: 'grid2' }, h('div', {}, fld('discount', 'Discount label')), h('div', {}, fld('offer_validity', 'Offer validity'))),
        fld('terms', 'Full offer phrase per language \u00b7 optional', 'lang'),
        fld('discovery_question', 'Question after the price, per language', 'lang')),
      sec('Pitch', fld('pitch_en', 'English'), fld('pitch_hi', 'Hindi'), fld('pitch_hinglish', 'Hinglish')),
      sec('Knowledge', fld('benefits', 'Benefits \u00b7 one per line', 'lines'), fld('knowledge', 'Facts the agent may use \u00b7 facts only', 'area')),
      sec('Behaviour', fld('tone', 'Tone notes'), tone.el, fld('allowed_numbers', 'Only call these numbers \u00b7 one per line \u00b7 empty = any number', 'lines')),
      neg.el, err = h('div', { class: 'err' })]));
    const save = async () => {
      const out = { ...base };
      for (const [k, [el, type]] of Object.entries(F)) {
        const v = el.value;
        if (type === 'lines') out[k] = v.split('\n').map((x) => x.trim()).filter(Boolean);
        else if (type === 'lang') { const o = {}; v.split('\n').forEach((line) => { const m = line.match(/^(en|hi|hinglish):\s*(.*)$/); if (m && m[2].trim()) o[m[1]] = m[2].trim(); }); out[k] = o; }
        else out[k] = v;
      }
      out.economics = neg.collect(); delete out.real_company;
      const id = pid || out.id;
      const bad = (k, msg) => { const el = F[k] && F[k][0]; if (el) { el.classList.add('invalid'); el.focus(); el.addEventListener('input', () => el.classList.remove('invalid'), { once: true }); } err.textContent = msg; };
      err.textContent = '';
      if (!id) return bad('id', 'Give the product an id, e.g. zenbrew-coffee.');
      if (!pid && !/^[a-z0-9][a-z0-9-]*$/.test(id)) return bad('id', 'The id may only use lowercase letters, digits and -, e.g. zenbrew-coffee.');
      if (!String(out.product_name || '').trim()) return bad('product_name', 'Give the product a name.');
      if (!pid && S.products[id]) return bad('id', 'A product with the id ' + id + ' already exists. Pick another id.');
      const btn = f.querySelector('.btn.pri'); if (btn) btn.disabled = true;
      try { await api('/api/products/' + id, { method: 'PUT', body: JSON.stringify(out) }); await Promise.all([loadProducts(), loadTenants()]); close(); render(); } catch (e) { err.textContent = e.message; err.scrollIntoView({ block: 'nearest' }); }
      if (btn) btn.disabled = false;
    };
    f.append(h('button', { class: 'btn pri', onclick: save }, ic('save', 'sm'), 'Save'), h('span', { style: 'flex:1' }), h('button', { class: 'btn ghost', onclick: close }, 'Cancel'));
  }, { wide: true, nofocus: true });
}

/* ---------------------------------------------------------------- progress */
async function pageProgress(p) {
  const draw = () => {
    if (S.page !== 'progress') return;
    p.innerHTML = '';
    const P = S.progress;
    if (!P) { p.append(h('div', { class: 'empty' }, 'Loading…')); return; }
    const r = P.roadmap, st = P.stats;
    const sec = (ms) => (ms ? (ms / 1000).toFixed(2) + 's' : '—');
    p.append(h('div', { class: 'pad' },
      head('Progress', 'What the tooling can do so far, and lifetime results. Refreshes every 10 seconds.', h('span', { class: 'tag green' }, r.tests + ' tests passing'), h('span', { class: 'tag' }, 'updated ' + r.updated)),
      h('div', { class: 'hero' }, h('div', { class: 'v' }, String(r.overall_pct), h('small', {}, '%')),
        h('div', {}, h('div', { class: 'sec-lbl', style: 'margin-bottom:8px' }, 'Overall tooling complete'), h('div', { class: 'big' }, h('i', { style: `width:${r.overall_pct}%` })),
          h('div', { class: 'hint', style: 'margin-top:8px' }, r.areas.length + ' areas · ' + r.areas.reduce((s, a) => s + a.items.length, 0) + ' capabilities' + (st.first_call ? ' · first call ' + new Date(st.first_call * 1000).toLocaleDateString() : '')))),
      h('div', { class: 'strip' }, [['Calls placed', st.calls], ['Answered', st.connected], ['Payment links sent', st.sold], ['Opt-outs honoured', st.opt_outs], ['Customer turns', st.customer_turns], ['Avg time to audio', sec(st.avg_first_audio_ms)], ['Median time to audio', sec(st.p50_first_audio_ms)], ['Simulated conversations', st.sim_conversations]]
        .map(([k, v]) => h('div', {}, h('div', { class: 'v' }, String(v ?? '—')), h('div', { class: 'k' }, k)))),
      h('div', { class: 'cols' },
        h('div', {}, r.areas.map((a) => { const avg = Math.round(a.items.reduce((s, i) => s + i.pct, 0) / a.items.length); return h('div', { class: 'panel' }, h('div', { class: 'panel-head' }, h('b', {}, a.name), h('span', { class: 'tag ' + (avg >= 80 ? 'green' : avg >= 40 ? 'amber' : 'red') }, avg + '%')),
          a.items.map((i) => h('div', { class: 'item' }, h('span', {}, i.name), h('div', { class: 'p' }, h('i', { class: i.pct >= 80 ? '' : i.pct >= 40 ? 'mid' : 'low', style: `width:${i.pct}%` })), h('span', { class: 'n' }, i.pct + '%')))); })),
        h('div', {},
          h('div', { class: 'panel' }, h('div', { class: 'panel-head' }, h('b', {}, 'Calls by product')), Object.entries(st.by_campaign || {}).map(([k, v]) => h('div', { class: 'item', style: 'grid-template-columns:1fr 100px 40px' }, h('span', {}, pname(k)), h('div', { class: 'p' }, h('i', { style: `width:${Math.round(100 * v / Math.max(1, st.calls))}%;background:hsl(var(--signal))` })), h('span', { class: 'n' }, String(v))))),
          h('div', { class: 'panel' }, h('div', { class: 'panel-head' }, h('b', {}, 'Changelog')), (r.log || []).map((x) => h('div', { class: 'log' }, h('div', { class: 'd' }, x.date), x.text)))))));
  };
  const load = async () => { try { S.progress = await api('/api/progress'); } catch {} draw(); };
  draw(); await load();
  clearInterval(S.progTimer);
  S.progTimer = setInterval(() => { if (S.page === 'progress') load(); else clearInterval(S.progTimer); }, 10000);
}

window.addEventListener('resize', () => { if (S.page === 'tree' && S.tree.pb) { S.tree.view = null; drawCanvas(); } });
boot();
})();
</script>
