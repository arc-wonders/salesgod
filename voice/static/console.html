<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalesGod Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens and shell from the GroundSet Motion product shell (product-shell.css, flow-builder.css). */
:root{
  --bg:220 10% 5.7%;--fg:60 8% 92%;--muted:216 5% 65%;--tertiary:217 5% 47%;--body:216 5% 65%;
  --rule:210 9% 13.5%;--rule-strong:214 8% 18%;--rule-heavy:216 8% 25%;
  --panel:214 12% 8%;--elevated:216 10% 10%;--sidebar:220 10% 5.7%;--hover:210 9% 12.5%;
  --signal:16 100% 56%;--green:153 44% 49%;--amber:38 85% 55%;--red:358 70% 60%;--blue:216 70% 64%;--slate:217 12% 60%;--violet:262 60% 68%;
  --font:'Geist',ui-sans-serif,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
}
.light{
  --bg:45 14% 95%;--fg:220 10% 9%;--muted:220 5% 36%;--tertiary:220 4% 48%;--body:220 6% 26%;
  --rule:40 8% 84%;--rule-strong:40 6% 76%;--rule-heavy:40 6% 70%;
  --panel:45 18% 98%;--elevated:45 12% 93%;--sidebar:45 12% 92%;--hover:40 10% 87%;
  --signal:16 100% 50%;--green:153 45% 32%;--amber:38 80% 36%;--red:358 65% 46%;--blue:216 55% 45%;--slate:217 12% 42%;--violet:262 45% 50%;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:hsl(var(--bg));color:hsl(var(--fg));font-family:var(--font);font-size:13px;line-height:1.5;font-feature-settings:'ss01','tnum'}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1.5px solid hsl(var(--signal));outline-offset:2px}
.mono{font-family:var(--mono)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:13px;height:13px}

/* shell */
.gs{display:flex;height:100dvh;overflow:hidden}
.side{display:flex;flex:0 0 228px;flex-direction:column;height:100dvh;border-right:1px solid hsl(var(--rule));background:hsl(var(--sidebar))}
.brand{display:flex;align-items:center;gap:10px;height:56px;flex:0 0 56px;padding:0 18px;border-bottom:1px solid hsl(var(--rule))}
.brand .mk{width:20px;height:20px;border-radius:5px;background:hsl(var(--signal));display:grid;place-items:center}
.brand .mk i{width:8px;height:8px;border-radius:50%;background:hsl(var(--bg))}
.brand b{font-weight:600;font-size:14px;letter-spacing:-.02em}
.brand small{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:hsl(var(--tertiary));text-transform:uppercase;margin-left:auto}
.nav{flex:1;overflow-y:auto;padding:16px 12px}
.group{margin-top:18px;padding:0 10px 8px;color:hsl(var(--tertiary));font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.group:first-child{margin-top:0}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;height:34px;margin-bottom:2px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:hsl(var(--muted));font-size:13px;font-weight:450;text-align:left;cursor:pointer;transition:color .15s,background .15s}
.nav-item svg{color:hsl(var(--tertiary))}
.nav-item:hover{background:hsl(var(--panel));color:hsl(var(--fg))}
.nav-item.on{background:hsl(var(--elevated));color:hsl(var(--fg));font-weight:500;box-shadow:inset 0 0 0 1px hsl(var(--rule))}
.nav-item.on svg{color:hsl(var(--fg))}
.nav-item.on::before{content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:2px;border-radius:0 2px 2px 0;background:hsl(var(--signal))}
.nav-item .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:hsl(var(--green))}
.side-foot{padding:8px 10px 12px;border-top:1px solid hsl(var(--rule));position:relative}
.org{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:1px solid transparent;border-radius:6px;background:transparent;text-align:left;cursor:pointer}
.org:hover{border-color:hsl(var(--rule-strong));background:hsl(var(--panel))}
.org .dot{width:8px;height:8px;flex:0 0 8px;border-radius:2px}
.org b{display:block;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org small{display:block;color:hsl(var(--tertiary));font-size:11px}
.menu{position:absolute;left:10px;right:10px;bottom:calc(100% - 4px);background:hsl(var(--panel));border:1px solid hsl(var(--rule-strong));border-radius:10px;padding:6px;box-shadow:0 18px 50px hsl(220 20% 1%/.45);z-index:40}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;border-radius:6px;background:none;cursor:pointer;text-align:left;font-size:12.5px}
.menu button:hover{background:hsl(var(--hover))}
.menu .sep{height:1px;background:hsl(var(--rule));margin:5px 0}
.main{display:flex;min-width:0;flex:1;flex-direction:column}
.topbar{display:flex;height:56px;flex:0 0 56px;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid hsl(var(--rule));background:hsl(var(--bg)/.94)}
.crumbs{display:flex;min-width:0;flex:1;align-items:center;gap:8px;color:hsl(var(--tertiary));font-size:12.5px;white-space:nowrap}
.crumbs i{font-style:normal}
.crumbs b{color:hsl(var(--fg));font-weight:500}
.icon-btn{display:grid;flex:0 0 34px;width:34px;height:34px;place-items:center;border:1px solid hsl(var(--rule-strong));border-radius:999px;background:transparent;color:hsl(var(--muted));cursor:pointer}
.icon-btn:hover{border-color:hsl(var(--rule-heavy));color:hsl(var(--fg))}
.conn{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border:1px solid hsl(var(--rule-strong));border-radius:999px;font-family:var(--mono);font-size:10.5px;color:hsl(var(--muted));letter-spacing:.04em}
.conn i{width:6px;height:6px;border-radius:50%;background:hsl(var(--tertiary))}
.conn.ok i{background:hsl(var(--green));box-shadow:0 0 0 3px hsl(var(--green)/.18)}
.conn.bad i{background:hsl(var(--red))}
.content{flex:1;min-height:0;overflow:auto}
.pad{max-width:1480px;margin:0 auto;padding:28px 32px 56px}
.flush{height:100%;display:flex;flex-direction:column;min-height:0}
.head{padding:22px 28px 16px;border-bottom:1px solid hsl(var(--rule));display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pad .head{padding:0 0 18px;margin-bottom:22px}
.head.compact{padding:14px 28px;align-items:center}
.head h1{margin:0;font-size:22px;font-weight:500;letter-spacing:-.025em;line-height:1.2}
.head p{max-width:650px;margin:6px 0 0;color:hsl(var(--body));font-size:12px;line-height:1.65}
.head .sp{flex:1}
.head .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border:1px solid hsl(var(--rule-strong));border-radius:999px;background:transparent;color:hsl(var(--fg));font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:hsl(var(--rule-heavy));background:hsl(var(--elevated))}
.btn.pri{background:hsl(var(--signal));border-color:hsl(var(--signal));color:hsl(220 10% 6%)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:27px;padding:0 10px;font-size:12px}
.btn.ghost{border-color:transparent;color:hsl(var(--muted))}
.btn.ghost:hover{color:hsl(var(--fg));background:hsl(var(--hover))}
.btn.danger{color:hsl(var(--red))}
.btn:disabled{opacity:.45;cursor:default;filter:none}
input,select,textarea{width:100%;height:32px;padding:0 10px;border:1px solid hsl(var(--rule-strong));border-radius:7px;background:hsl(var(--bg));font-size:12.5px}
textarea{height:auto;padding:8px 10px;resize:vertical;line-height:1.55}
input:hover,select:hover,textarea:hover{border-color:hsl(var(--rule-heavy))}
select.inline{width:auto}
.lbl{display:block;margin:12px 0 5px;color:hsl(var(--tertiary));font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.hint{color:hsl(var(--tertiary));font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.err{color:hsl(var(--red));font-size:12px;margin-top:8px;white-space:pre-wrap}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border:1px solid hsl(var(--rule-strong));border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:hsl(var(--muted));white-space:nowrap}
.tag b{font-weight:500;color:hsl(var(--fg))}
.tag.sig{color:hsl(var(--signal));border-color:hsl(var(--signal)/.45);background:hsl(var(--signal)/.07)}
.tag.green{color:hsl(var(--green));border-color:hsl(var(--green)/.45)}
.tag.red{color:hsl(var(--red));border-color:hsl(var(--red)/.45)}
.tag.amber{color:hsl(var(--amber));border-color:hsl(var(--amber)/.45)}
.tag.blue{color:hsl(var(--blue));border-color:hsl(var(--blue)/.45)}
.sec-lbl{font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:hsl(var(--tertiary))}
.empty{padding:48px 24px;text-align:center;color:hsl(var(--tertiary));font-size:12px}
.empty b{display:block;color:hsl(var(--fg));font-size:14px;font-weight:500;margin-bottom:4px}

/* live */
.live{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) 320px}
.live>section{min-height:0;overflow-y:auto;overflow-x:hidden;border-right:1px solid hsl(var(--rule))}
.live>section:last-child{border-right:0;background:hsl(var(--panel))}
.pane-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-bottom:1px solid hsl(var(--rule));background:hsl(var(--bg)/.96)}
.live>section:last-child .pane-head{background:hsl(var(--panel)/.96)}
.ci{display:block;width:100%;padding:11px 16px;border:0;border-bottom:1px solid hsl(var(--rule));background:none;text-align:left;cursor:pointer}
.ci:hover{background:hsl(var(--panel))}
.ci.on{background:hsl(var(--elevated));box-shadow:inset 2px 0 0 hsl(var(--signal))}
.ci .t{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
.ci .m{margin-top:3px;color:hsl(var(--tertiary));font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:hsl(var(--tertiary))}
.st.live{color:hsl(var(--green))}.st.ringing,.st.dialing{color:hsl(var(--amber))}.st.failed{color:hsl(var(--red))}
.pulse{width:7px;height:7px;border-radius:50%;background:hsl(var(--green));animation:pl 1.6s infinite;flex:none}
@keyframes pl{0%{box-shadow:0 0 0 0 hsl(var(--green)/.55)}100%{box-shadow:0 0 0 8px hsl(var(--green)/0)}}
.tx{padding:18px 24px 40px;display:flex;flex-direction:column;gap:14px;max-width:880px}
.turn{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px}
.turn .who{padding-top:2px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--tertiary))}
.turn.c .who{color:hsl(var(--muted))}
.turn.a .who{color:hsl(var(--signal))}
.turn .txt{font-size:13.5px;line-height:1.6}
.turn.c .txt{color:hsl(var(--body))}
.turn .sub{margin-top:3px;font-family:var(--mono);font-size:10px;color:hsl(var(--tertiary))}
.dec{margin-top:10px;border:1px solid hsl(var(--rule));border-radius:10px;background:hsl(var(--panel));overflow:hidden}
.dec .r1{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid hsl(var(--rule))}
.dec .r2{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid hsl(var(--rule))}
.dec .r2>div{padding:8px 12px;border-right:1px solid hsl(var(--rule))}
.dec .r2>div:last-child{border-right:0}
.meter{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:hsl(var(--tertiary));display:flex;justify-content:space-between}
.meter b{color:hsl(var(--fg));font-weight:500}
.bar{height:3px;margin-top:6px;border-radius:2px;background:hsl(var(--rule-strong));overflow:hidden}
.bar i{display:block;height:100%;background:hsl(var(--signal))}
.bar.red i{background:hsl(var(--red))}.bar.amber i{background:hsl(var(--amber))}.bar.blue i{background:hsl(var(--blue))}
.dec .r3{padding:9px 12px;font-size:12px;color:hsl(var(--body))}
.dec .r3 em{color:hsl(var(--tertiary));font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.dec details{padding:0 12px 9px;font-size:11.5px;color:hsl(var(--tertiary))}
.dec details pre{margin:6px 0 0;white-space:pre-wrap;font-family:var(--mono);font-size:10.5px}
.path{padding:14px 16px}
.step{position:relative;display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:7px;color:hsl(var(--tertiary));font-size:12.5px}
.step .n{width:18px;font-family:var(--mono);font-size:10px;color:hsl(var(--tertiary))}
.step.passed{color:hsl(var(--muted))}
.step.hot{background:hsl(var(--signal)/.1);color:hsl(var(--fg));box-shadow:inset 0 0 0 1px hsl(var(--signal)/.5)}
.step.hot .n{color:hsl(var(--signal))}
.leaf{margin:4px 0 6px 28px;padding:9px 11px;border:1px solid hsl(var(--signal)/.5);border-radius:8px;background:hsl(var(--signal)/.06);font-size:12px}
.leaf .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--signal))}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 10px;padding:14px 16px;margin:0;border-top:1px solid hsl(var(--rule));font-size:12px}
.kv dt{color:hsl(var(--tertiary));font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding-top:1px}
.kv dd{margin:0;overflow-wrap:anywhere}

/* tree */
.tree{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.canvas{position:relative;overflow:hidden;cursor:grab;touch-action:none;background-color:hsl(var(--bg));background-image:radial-gradient(hsl(var(--rule-strong)) 1px,transparent 1px);background-size:20px 20px}
.canvas.drag{cursor:grabbing}
.layer{position:absolute;left:0;top:0;transform-origin:0 0}
.layer svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:hsl(var(--rule-heavy));stroke-width:1.4}
.edge.hot{stroke:hsl(var(--signal));stroke-width:2.2;stroke-dasharray:6 5;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
.nd{position:absolute;width:212px;border:1px solid hsl(var(--rule-strong));border-radius:10px;background:hsl(var(--panel));padding:9px 11px 8px;box-shadow:0 1px 2px rgba(0,0,0,.18);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.nd::before{content:'';position:absolute;left:-1px;top:10px;bottom:10px;width:2px;border-radius:0 2px 2px 0;background:var(--kind)}
.nd:hover{border-color:hsl(var(--rule-heavy))}
.nd .k{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--kind)}
.nd .t{margin-top:3px;font-size:13px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd .m{margin-top:2px;font-size:11px;color:hsl(var(--tertiary));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd.sel{border-color:hsl(var(--blue));box-shadow:0 0 0 3px hsl(var(--blue)/.18)}
.nd.hot{border-color:hsl(var(--signal));box-shadow:0 0 0 3px hsl(var(--signal)/.22),0 0 24px hsl(var(--signal)/.25)}
.nd.new{border-style:dashed;border-color:hsl(var(--green))}
.nd.dirty .k::after{content:'edited';margin-left:auto;color:hsl(var(--amber));letter-spacing:.08em}
.k-root{--kind:hsl(var(--signal))}.k-gate{--kind:hsl(var(--slate))}.k-gate-safety{--kind:hsl(var(--red))}.k-gate-compliance{--kind:hsl(var(--blue))}.k-gate-close{--kind:hsl(var(--green))}.k-gate-conversation{--kind:hsl(var(--amber))}
.k-node{--kind:hsl(var(--violet))}.k-free{--kind:hsl(var(--tertiary))}
.col-lbl{position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--tertiary));white-space:nowrap}
.tools{position:absolute;top:12px;left:12px;right:12px;z-index:5;display:flex;align-items:center;gap:6px;flex-wrap:wrap;pointer-events:none}
.tools>*{pointer-events:auto}
.tools .btn{background:hsl(var(--panel))}
.tools .btn.pri{background:hsl(var(--signal))}
.zoom{position:absolute;left:12px;bottom:12px;z-index:5;display:flex;flex-direction:column;border:1px solid hsl(var(--rule-strong));border-radius:8px;overflow:hidden;background:hsl(var(--panel))}
.zoom button{display:grid;place-items:center;width:30px;height:28px;border:0;border-bottom:1px solid hsl(var(--rule));background:none;cursor:pointer;color:hsl(var(--muted))}
.zoom button:last-child{border-bottom:0}
.zoom button:hover{color:hsl(var(--fg));background:hsl(var(--hover))}
.legend{position:absolute;right:12px;bottom:12px;z-index:5;display:flex;gap:12px;padding:7px 11px;border:1px solid hsl(var(--rule));border-radius:8px;background:hsl(var(--panel)/.92);font-size:11px;color:hsl(var(--tertiary))}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.insp{border-left:1px solid hsl(var(--rule));background:hsl(var(--panel));overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.insp-head{padding:16px 18px 14px;border-bottom:1px solid hsl(var(--rule))}
.insp-head .k{font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--kind)}
.insp-head h3{margin:4px 0 0;font-size:15px;font-weight:500;letter-spacing:-.01em}
.insp-head p{margin:6px 0 0;color:hsl(var(--body));font-size:12px;line-height:1.6}
.insp-body{padding:4px 18px 22px;flex:1}
.insp-foot{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 18px;border-top:1px solid hsl(var(--rule));background:hsl(var(--panel))}
.pts{margin:8px 0 0;padding:0;list-style:none}
.pts li{position:relative;padding:6px 0 6px 16px;border-bottom:1px solid hsl(var(--rule));font-size:12.5px;color:hsl(var(--body))}
.pts li::before{content:'';position:absolute;left:2px;top:13px;width:5px;height:5px;border:1px solid hsl(var(--signal))}

/* sim */
.sim{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}
.sim>section{min-height:0;display:flex;flex-direction:column;border-right:1px solid hsl(var(--rule))}
.sim>section:last-child{border-right:0;background:hsl(var(--panel));overflow:auto;display:block}
.sim .bar-top{display:flex;gap:8px;align-items:center;padding:10px 24px;border-bottom:1px solid hsl(var(--rule));flex-wrap:wrap}
.sim .scroll{flex:1;overflow:auto}
.composer{display:flex;gap:8px;padding:12px 24px;border-top:1px solid hsl(var(--rule))}
.composer input{height:38px;border-radius:999px;padding:0 16px}
.composer .btn{height:38px}

/* progress */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid hsl(var(--rule));border-radius:10px;overflow:hidden;background:hsl(var(--panel))}
.strip>div{padding:14px 17px;border-right:1px solid hsl(var(--rule));border-bottom:1px solid hsl(var(--rule))}
.strip>div:nth-child(4n){border-right:0}
.strip>div:nth-last-child(-n+4){border-bottom:0}
.strip .v{font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.strip .k{margin-top:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--tertiary))}
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:20px 22px;margin-bottom:16px;border:1px solid hsl(var(--rule));border-radius:10px;background:hsl(var(--panel))}
.hero .v{font-size:44px;font-weight:500;letter-spacing:-.04em;line-height:1}
.hero .v small{font-size:20px;color:hsl(var(--tertiary))}
.big{height:6px;border-radius:3px;background:hsl(var(--rule-strong));overflow:hidden}
.big i{display:block;height:100%;background:hsl(var(--signal));transition:width .6s}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;margin-top:16px;align-items:start}
.panel{border:1px solid hsl(var(--rule));border-radius:10px;background:hsl(var(--panel));overflow:hidden}
.panel+.panel{margin-top:16px}
.panel-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid hsl(var(--rule))}
.panel-head b{font-weight:500;font-size:13px}
.panel-head .tag{margin-left:auto}
.item{display:grid;grid-template-columns:minmax(0,1fr) 140px 40px;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid hsl(var(--rule));font-size:12.5px}
.item:last-child{border-bottom:0}
.item .p{height:4px;border-radius:2px;background:hsl(var(--rule-strong));overflow:hidden}
.item .p i{display:block;height:100%;background:hsl(var(--green))}
.item .p i.mid{background:hsl(var(--amber))}.item .p i.low{background:hsl(var(--red))}
.item .n{font-family:var(--mono);font-size:11px;color:hsl(var(--muted));text-align:right}
.log{padding:10px 16px;border-bottom:1px solid hsl(var(--rule));font-size:12.5px;color:hsl(var(--body))}
.log:last-child{border-bottom:0}
.log .d{font-family:var(--mono);font-size:10px;color:hsl(var(--tertiary));letter-spacing:.04em}

/* tenants */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pcard{display:block;width:100%;padding:16px;border:1px solid hsl(var(--rule));border-radius:10px;background:hsl(var(--panel));text-align:left;cursor:pointer;position:relative}
.pcard:hover{border-color:hsl(var(--rule-heavy))}
.pcard .k{font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:hsl(var(--tertiary))}
.pcard b{display:block;margin-top:4px;font-size:15px;font-weight:500}
.pcard dl{display:grid;grid-template-columns:90px 1fr;gap:5px 8px;margin:12px 0 0;font-size:12px}
.pcard dt{color:hsl(var(--tertiary));font-family:var(--mono);font-size:10px;padding-top:2px}
.pcard dd{margin:0}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:min(12vh,100px) 16px 20px;background:hsl(220 20% 2%/.62);backdrop-filter:blur(3px)}
.dialog{width:min(580px,100%);max-height:80vh;overflow:auto;border:1px solid hsl(var(--rule-strong));border-radius:14px;background:hsl(var(--panel));box-shadow:0 22px 70px hsl(220 20% 1%/.6);animation:pop .16s ease-out both}
.dialog .dh{padding:16px 20px 12px;border-bottom:1px solid hsl(var(--rule))}
.dialog .dh h3{margin:0;font-size:15px;font-weight:500}
.dialog .dh p{margin:4px 0 0;color:hsl(var(--body));font-size:12px}
.dialog .db{padding:6px 20px 18px}
.dialog .df{display:flex;gap:8px;padding:12px 20px;border-top:1px solid hsl(var(--rule));position:sticky;bottom:0;background:hsl(var(--panel))}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.login{min-height:100dvh;display:grid;place-items:center;padding:16px}
.login .box{width:min(360px,100%);border:1px solid hsl(var(--rule-strong));border-radius:14px;background:hsl(var(--panel));padding:24px}
.login h1{margin:14px 0 4px;font-size:20px;font-weight:500;letter-spacing:-.02em}
.enter{animation:enter .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:1100px){.live{grid-template-columns:260px minmax(0,1fr)}.live>section:last-child{display:none}.tree,.sim{grid-template-columns:1fr}.insp,.sim>section:last-child{display:none}.cols{grid-template-columns:1fr}}
@media (max-width:760px){.side{display:none}.live{grid-template-columns:1fr}.live>section:first-child{max-height:200px}.strip{grid-template-columns:repeat(2,1fr)}.pad{padding:20px 16px 40px}.topbar{padding:0 16px}}

/* ---------------------------------------------------------------- simulator */
function pageSim(p) {
  const ps = tenantProducts();
  if (!S.sim.pid || !ps.find((x) => x.id === S.sim.pid)) S.sim.pid = ps[0]?.id || null;
  p.innerHTML = '';
  let inp;
  const last = [...S.sim.turns].reverse().find((t) => t.role === 'agent' && t.trace);
  const start = async () => {
    S.sim.turns = []; S.sim.sid = null; S.sim.busy = true; pageSim(p);
    try {
      const j = await api('/api/sim/start', { method: 'POST', body: JSON.stringify({ persona: 'console', campaign: S.sim.pid, language: S.sim.lang, customer_age: S.sim.age || null, backend: S.sim.model }) });
      S.sim.sid = j.sim_id; S.sim.turns = [{ role: 'agent', text: j.agent, intent: 'opening' }];
    } catch (e) { notice(e.message); }
    S.sim.busy = false; if (S.page === 'sim') pageSim(p);
  };
  const say = async () => {
    const text = inp.value.trim(); if (!text || S.sim.busy || !S.sim.sid) return;
    S.sim.busy = true; S.sim.turns.push({ role: 'customer', text }); pageSim(p);
    try { const j = await api('/api/sim/' + S.sim.sid, { method: 'POST', body: JSON.stringify({ text }) }); S.sim.turns.push({ role: 'agent', ...j, text: j.agent }); }
    catch (e) { S.sim.turns.push({ role: 'agent', text: '⚠ ' + e.message }); }
    S.sim.busy = false; if (S.page === 'sim') pageSim(p);
  };
  const sel = (key, opts) => h('select', { class: 'inline', onchange: (e) => { S.sim[key] = e.target.value; } }, opts.map(([v, n]) => h('option', { value: v, selected: v === S.sim[key] }, n)));
  const scroll = h('div', { class: 'scroll' }, S.sim.turns.length ? h('div', { class: 'tx' }, S.sim.turns.map((t) => turnView(t, S.sim.model)), S.sim.busy ? h('div', { class: 'hint', style: 'padding-left:88px' }, 'agent is thinking…') : null)
    : h('div', { class: 'empty' }, h('b', {}, S.sim.busy ? 'Starting…' : 'Talk to the agent by text'), 'Same pipeline as a phone call (understanding, gates, decision tree, reply model, checker), without audio.'));
  p.append(h('div', { class: 'flush' },
    head('Simulator', 'Type as the customer. Each reply shows the decision behind it.'),
    h('div', { class: 'sim' },
      h('section', {},
        h('div', { class: 'bar-top' },
          sel('pid', ps.map((x) => [x.id, x.product_name])), sel('lang', [['hinglish', 'Hinglish'], ['hi', 'Hindi'], ['en', 'English']]),
          h('input', { type: 'number', placeholder: 'age', style: 'width:84px', value: S.sim.age, oninput: (e) => { S.sim.age = e.target.value; } }),
          sel('model', [['gemini', 'Gemini 3.5 Flash'], ['qwen', 'Qwen3-14B'], ['template', 'Templates']]),
          h('span', { style: 'flex:1' }), h('button', { class: 'btn pri sm', disabled: S.sim.busy || !S.sim.pid, onclick: start }, ic('play', 'sm'), S.sim.sid ? 'Restart' : 'Start')),
        scroll,
        h('div', { class: 'composer' }, inp = h('input', { placeholder: S.sim.sid ? 'Say something as the customer…' : 'Start a conversation first', disabled: !S.sim.sid, onkeydown: (e) => { if (e.key === 'Enter') say(); } }),
          h('button', { class: 'btn pri', disabled: !S.sim.sid || S.sim.busy, onclick: say }, ic('send', 'sm'), 'Send'))),
      h('section', {}, h('div', { class: 'pane-head', style: 'background:transparent' }, h('span', { class: 'sec-lbl' }, 'Decision path'), h('span', { class: 'hint' }, 'latest turn')),
        last ? pathView(last) : h('div', { class: 'empty' }, 'Appears after the first reply.')))));
  scroll.scrollTop = scroll.scrollHeight;
  if (S.sim.sid && !S.sim.busy) inp.focus();
}

/* ---------------------------------------------------------------- tenants & products */
function pageTenants(p) {
  p.innerHTML = '';
  const t = S.tenants.find((x) => x.id === S.tenant) || {};
  const ps = tenantProducts();
  p.append(h('div', { class: 'pad' },
    head('Tenants & products', 'Each tenant has its own products, and each product its own offer, knowledge and decision tree.',
      h('button', { class: 'btn', onclick: addTenant }, ic('plus', 'sm'), 'New tenant'), h('button', { class: 'btn pri', onclick: () => editProduct(null) }, ic('plus', 'sm'), 'New product')),
    h('div', { class: 'sec-lbl', style: 'margin-bottom:10px' }, 'Tenants'),
    h('div', { class: 'cards', style: 'margin-bottom:28px' }, S.tenants.map((x) => h('button', { class: 'pcard', style: x.id === S.tenant ? 'box-shadow:inset 0 0 0 1px hsl(var(--signal)/.5)' : '', onclick: () => { S.tenant = x.id; store.set('sg_tenant', x.id); S.tree.pid = null; S.sel = null; render(); } },
      h('div', { class: 'k', style: `color:${x.color}` }, x.id === S.tenant ? 'Current tenant' : 'Tenant'), h('b', {}, x.name),
      h('dl', {}, h('dt', {}, 'id'), h('dd', { class: 'mono' }, x.id), h('dt', {}, 'products'), h('dd', {}, (x.products || []).map(pname).join(', ') || '—'))))),
    h('div', { class: 'sec-lbl', style: 'margin-bottom:10px' }, 'Products · ' + (t.name || '')),
    ps.length ? h('div', { class: 'cards' }, ps.map((x) => h('button', { class: 'pcard', onclick: () => editProduct(x.id) },
      h('div', { class: 'k' }, x.seller_name || 'Product'), h('b', {}, x.product_name),
      h('dl', {}, h('dt', {}, 'offer'), h('dd', {}, `${x.offer_price} · ${x.discount}`), h('dt', {}, 'normal'), h('dd', {}, x.original_price), h('dt', {}, 'validity'), h('dd', {}, x.offer_validity || '—'),
        h('dt', {}, 'agent'), h('dd', {}, x.agent_name || '—'), h('dt', {}, 'can call'), h('dd', {}, (x.allowed_numbers || []).length ? (x.allowed_numbers.length + ' test numbers only') : 'any number')))))
      : h('div', { class: 'empty' }, h('b', {}, 'No products'), 'Create one with New product.')));
}
function addTenant() {
  modal('New tenant', 'A company that sells through the agent.', (b, f, close) => {
    let id, name, color, err;
    b.append(h('label', { class: 'lbl' }, 'Name'), name = h('input', { oninput: () => { id.value = name.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); } }),
      h('label', { class: 'lbl' }, 'Id'), id = h('input', { class: 'mono' }),
      h('label', { class: 'lbl' }, 'Colour'), color = h('input', { type: 'color', value: '#4f7cff', style: 'width:64px;padding:2px' }), err = h('div', { class: 'err' }));
    f.append(h('button', { class: 'btn pri', onclick: async () => { try { await api('/api/tenants/' + id.value.trim(), { method: 'PUT', body: JSON.stringify({ name: name.value, color: color.value }) }); await loadTenants(); S.tenant = id.value.trim(); store.set('sg_tenant', S.tenant); close(); render(); } catch (e) { err.textContent = e.message; } } }, 'Create'), h('button', { class: 'btn ghost', onclick: close }, 'Cancel'));
  });
}
function editProduct(pid) {
  const base = pid ? JSON.parse(JSON.stringify(S.products[pid])) : { id: '', tenant: S.tenant, product_name: '', seller_name: S.tenants.find((t) => t.id === S.tenant)?.name || '', agent_name: 'Arjun', original_price: '', offer_price: '', discount: '', offer_validity: '', benefits: [], knowledge: '', pitch_en: '', pitch_hi: '', pitch_hinglish: '', faqs: [], allowed_numbers: [], price_note: '', rupee_terms: {}, renewal_note: {}, annual_note: {}, sms_text: '' };
  modal(pid ? base.product_name : 'New product', pid ? 'Changes apply to the next call.' : 'What the agent sells, and the facts it may use.', (b, f, close) => {
    const F = {}; let err;
    const fld = (k, label, type) => {
      const v = base[k]; let el;
      if (type === 'lines') el = h('textarea', { rows: 3 }, (v || []).join('\n'));
      else if (type === 'area') el = h('textarea', { rows: 5 }, v || '');
      else if (type === 'lang') el = h('textarea', { rows: 3, class: 'mono', style: 'font-size:11.5px' }, ['en', 'hi', 'hinglish'].map((x) => x + ': ' + ((v || {})[x] || '')).join('\n'));
      else el = h('input', { value: v ?? '' });
      F[k] = [el, type]; return [h('label', { class: 'lbl' }, label), el];
    };
    const tsel = h('select', {}, S.tenants.map((t) => h('option', { value: t.id, selected: t.id === (base.tenant || S.tenant) }, t.name)));
    F.tenant = [tsel, 'text'];
    b.append(
      !pid ? fld('id', 'Id · letters, digits, -') : null,
      h('label', { class: 'lbl' }, 'Tenant'), tsel,
      h('div', { class: 'grid2' }, h('div', {}, fld('product_name', 'Product name')), h('div', {}, fld('seller_name', 'Calling for (company)'))),
      h('div', { class: 'grid2' }, h('div', {}, fld('agent_name', 'Agent name')), h('div', {}, fld('discount', 'Discount label'))),
      h('div', { class: 'grid2' }, h('div', {}, fld('original_price', 'Normal price')), h('div', {}, fld('offer_price', 'Offer price'))),
      fld('offer_validity', 'Offer validity'),
      fld('terms', 'Full offer phrase per language · optional', 'lang'),
      fld('discovery_question', 'Question after the price, per language', 'lang'),
      fld('pitch_en', 'Pitch · English'), fld('pitch_hi', 'Pitch · Hindi'), fld('pitch_hinglish', 'Pitch · Hinglish'),
      fld('benefits', 'Benefits · one per line', 'lines'),
      fld('knowledge', 'Knowledge the agent may use · facts only', 'area'),
      fld('tone', 'Tone'), fld('allowed_numbers', 'Only call these numbers · one per line · empty = any', 'lines'),
      err = h('div', { class: 'err' }));
    const save = async () => {
      const out = { ...base };
      for (const [k, [el, type]] of Object.entries(F)) {
        const v = el.value;
        if (type === 'lines') out[k] = v.split('\n').map((x) => x.trim()).filter(Boolean);
        else if (type === 'lang') { const o = {}; v.split('\n').forEach((line) => { const m = line.match(/^(en|hi|hinglish):\s*(.*)$/); if (m && m[2].trim()) o[m[1]] = m[2].trim(); }); out[k] = o; }
        else out[k] = v;
      }
      const id = pid || out.id; if (!id) { err.textContent = 'Id is required'; return; }
      try { await api('/api/products/' + id, { method: 'PUT', body: JSON.stringify(out) }); await Promise.all([loadProducts(), loadTenants()]); close(); render(); } catch (e) { err.textContent = e.message; }
    };
    f.append(h('button', { class: 'btn pri', onclick: save }, ic('save', 'sm'), 'Save'), h('button', { class: 'btn ghost', onclick: close }, 'Cancel'));
  });
}

/* ---------------------------------------------------------------- progress */
async function pageProgress(p) {
  const draw = () => {
    if (S.page !== 'progress') return;
    p.innerHTML = '';
    const P = S.progress;
    if (!P) { p.append(h('div', { class: 'empty' }, 'Loading…')); return; }
    const r = P.roadmap, st = P.stats;
    const sec = (ms) => (ms ? (ms / 1000).toFixed(2) + 's' : '—');
    p.append(h('div', { class: 'pad' },
      head('Progress', 'What the tooling can do so far, and lifetime results. Refreshes every 10 seconds.', h('span', { class: 'tag green' }, r.tests + ' tests passing'), h('span', { class: 'tag' }, 'updated ' + r.updated)),
      h('div', { class: 'hero' }, h('div', { class: 'v' }, String(r.overall_pct), h('small', {}, '%')),
        h('div', {}, h('div', { class: 'sec-lbl', style: 'margin-bottom:8px' }, 'Overall tooling complete'), h('div', { class: 'big' }, h('i', { style: `width:${r.overall_pct}%` })),
          h('div', { class: 'hint', style: 'margin-top:8px' }, r.areas.length + ' areas · ' + r.areas.reduce((s, a) => s + a.items.length, 0) + ' capabilities' + (st.first_call ? ' · first call ' + new Date(st.first_call * 1000).toLocaleDateString() : '')))),
      h('div', { class: 'strip' }, [['Calls placed', st.calls], ['Answered', st.connected], ['Payment links sent', st.sold], ['Opt-outs honoured', st.opt_outs], ['Customer turns', st.customer_turns], ['Avg time to audio', sec(st.avg_first_audio_ms)], ['Median time to audio', sec(st.p50_first_audio_ms)], ['Simulated conversations', st.sim_conversations]]
        .map(([k, v]) => h('div', {}, h('div', { class: 'v' }, String(v ?? '—')), h('div', { class: 'k' }, k)))),
      h('div', { class: 'cols' },
        h('div', {}, r.areas.map((a) => { const avg = Math.round(a.items.reduce((s, i) => s + i.pct, 0) / a.items.length); return h('div', { class: 'panel' }, h('div', { class: 'panel-head' }, h('b', {}, a.name), h('span', { class: 'tag ' + (avg >= 80 ? 'green' : avg >= 40 ? 'amber' : 'red') }, avg + '%')),
          a.items.map((i) => h('div', { class: 'item' }, h('span', {}, i.name), h('div', { class: 'p' }, h('i', { class: i.pct >= 80 ? '' : i.pct >= 40 ? 'mid' : 'low', style: `width:${i.pct}%` })), h('span', { class: 'n' }, i.pct + '%')))); })),
        h('div', {},
          h('div', { class: 'panel' }, h('div', { class: 'panel-head' }, h('b', {}, 'Calls by product')), Object.entries(st.by_campaign || {}).map(([k, v]) => h('div', { class: 'item', style: 'grid-template-columns:1fr 100px 40px' }, h('span', {}, pname(k)), h('div', { class: 'p' }, h('i', { style: `width:${Math.round(100 * v / Math.max(1, st.calls))}%;background:hsl(var(--signal))` })), h('span', { class: 'n' }, String(v))))),
          h('div', { class: 'panel' }, h('div', { class: 'panel-head' }, h('b', {}, 'Changelog')), (r.log || []).map((x) => h('div', { class: 'log' }, h('div', { class: 'd' }, x.date), x.text)))))));
  };
  const load = async () => { try { S.progress = await api('/api/progress'); } catch {} draw(); };
  draw(); await load();
  clearInterval(S.progTimer);
  S.progTimer = setInterval(() => { if (S.page === 'progress') load(); else clearInterval(S.progTimer); }, 10000);
}

document.addEventListener('click', (e) => { if (S.menu && !e.target.closest('.side-foot')) { S.menu = false; render(); } });
window.addEventListener('resize', () => { if (S.page === 'tree' && S.tree.pb) { S.tree.view = null; drawCanvas(); } });
boot();
